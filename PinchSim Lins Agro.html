<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PinchSim Lins Agro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Conceito: painel de controle de usina ao entardecer. Fundo azul-noite, cartões flutuantes,
   verde como cor de ação e de prova; laranja e azul reservados para quente e frio. */
:root{
  --scene:dark;
  --bg:#060C18;--side:#0B1427;--surface:#0E1A2F;--surface2:#13223B;--surface3:#192B48;
  --line:#1D2E4C;--line2:#2B4168;--ink:#EAF0FA;--ink2:#B4C1D7;--muted:#8090AA;
  --accent:#45D07D;--accent2:#2EB565;--accent-ink:#04200F;--accent-soft:#12301F;
  --hot:#F28A2E;--hot-soft:#3A2412;--cold:#3D9DF2;--cold-soft:#11284A;--violet:#9C8CF2;
  --warn:#F2B544;--warn-soft:#3A2C10;--crit:#F27474;--crit-soft:#3F1A1C;--good:#45D07D;--good-soft:#12301F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --st1:#f5d78a;--st2:#d49a16;--st3:#9a6c00;--st4:#6a4a00;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --scene:light;
  --bg:#E9EFF6;--side:#FFFFFF;--surface:#FFFFFF;--surface2:#F2F6FA;--surface3:#E6EDF5;
  --line:#DAE3EE;--line2:#C3D0E0;--ink:#0D1A2C;--ink2:#38485F;--muted:#5F6F87;
  --accent:#138A45;--accent2:#0F7339;--accent-ink:#FFFFFF;--accent-soft:#DDF2E5;
  --hot:#D2620E;--hot-soft:#FCE8D6;--cold:#1C72CC;--cold-soft:#DCEBFA;--violet:#5B49C9;
  --warn:#8F5A00;--warn-soft:#FBEBCB;--crit:#B3261E;--crit-soft:#F9DEDB;--good:#138A45;--good-soft:#DDF2E5;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --st1:#f5cf73;--st2:#d49400;--st3:#8f5f00;--st4:#543800;
  --shadow:0 8px 24px rgba(20,40,70,.08);
  color-scheme:light}}
:root[data-theme="light"],body[data-look="light"]{
  --scene:light;
  --bg:#E9EFF6;--side:#FFFFFF;--surface:#FFFFFF;--surface2:#F2F6FA;--surface3:#E6EDF5;
  --line:#DAE3EE;--line2:#C3D0E0;--ink:#0D1A2C;--ink2:#38485F;--muted:#5F6F87;
  --accent:#138A45;--accent2:#0F7339;--accent-ink:#FFFFFF;--accent-soft:#DDF2E5;
  --hot:#D2620E;--hot-soft:#FCE8D6;--cold:#1C72CC;--cold-soft:#DCEBFA;--violet:#5B49C9;
  --warn:#8F5A00;--warn-soft:#FBEBCB;--crit:#B3261E;--crit-soft:#F9DEDB;--good:#138A45;--good-soft:#DDF2E5;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --st1:#f5cf73;--st2:#d49400;--st3:#8f5f00;--st4:#543800;
  --shadow:0 8px 24px rgba(20,40,70,.08);
  color-scheme:light}
body[data-look="dark"]{
  --scene:dark;
  --bg:#060C18;--side:#0B1427;--surface:#0E1A2F;--surface2:#13223B;--surface3:#192B48;
  --line:#1D2E4C;--line2:#2B4168;--ink:#EAF0FA;--ink2:#B4C1D7;--muted:#8090AA;
  --accent:#45D07D;--accent2:#2EB565;--accent-ink:#04200F;--accent-soft:#12301F;
  --hot:#F28A2E;--hot-soft:#3A2412;--cold:#3D9DF2;--cold-soft:#11284A;--violet:#9C8CF2;
  --warn:#F2B544;--warn-soft:#3A2C10;--crit:#F27474;--crit-soft:#3F1A1C;--good:#45D07D;--good-soft:#12301F;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --st1:#f5d78a;--st2:#d49a16;--st3:#9a6c00;--st4:#6a4a00;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:500 14.5px/1.5 var(--ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}
h4{font:700 11.5px var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
a{color:var(--accent)}
sub,sup{font-size:.72em;line-height:0}
button{font:inherit;color:inherit}
.ic{flex:none;display:block}
.mono,code{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}

/* estrutura */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;max-width:1520px;margin:0 auto;align-items:start}
.side{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow-y:auto;scrollbar-width:thin;background:var(--side);border:1px solid var(--line);border-radius:18px;padding:20px 12px 14px;display:flex;flex-direction:column;gap:18px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-inline:6px}
.logo svg{width:48px;height:48px}
.logo b{font:700 25px/1 var(--display);letter-spacing:-.02em}
.logo b span{color:var(--accent)}
.logo small{font-size:12px;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font:700 10.5px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--ink2);font:600 13.5px var(--ui);cursor:pointer;text-align:left}
.nav button .n{margin-left:auto;font:600 11px var(--mono);color:var(--muted)}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,var(--accent2),var(--accent));color:var(--accent-ink);box-shadow:0 6px 18px rgba(46,181,101,.25)}
.nav button[aria-current="page"] .n{color:var(--accent-ink)}
.nav button.sub{padding-left:22px;font-size:13px}
.sidefoot{margin-top:auto;border-radius:14px;overflow:hidden;position:relative;min-height:122px;background:var(--surface2);border:1px solid var(--line)}
.sidefoot canvas{position:absolute;inset:0;width:100%;height:100%}
.sidefoot div{position:relative;padding:12px 14px;font-size:12.5px;line-height:1.35;color:var(--ink)}
.sidefoot b{display:block;font:600 14px var(--display);margin-bottom:2px}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding-block:2px 10px;margin-top:-2px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.top .tt{display:flex;align-items:center;gap:10px;min-width:0}
.top .tt h1{font-size:19px}
.top .tt h1 span{color:var(--accent)}
.top .tt p{font-size:12.5px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px 6px 5px 10px;font:600 12.5px var(--ui);color:var(--muted)}
.pill select{background:var(--surface2);border:1px solid var(--line2);color:var(--ink);font:600 13px var(--ui);border-radius:7px;padding:5px 8px;max-width:230px}
.pill .fixed{color:var(--ink);background:var(--surface2);border:1px solid var(--line2);border-radius:7px;padding:5px 9px;white-space:nowrap}
.pill input[type=range]{width:110px;accent-color:var(--accent)}
.pill output{font:600 13px var(--mono);color:var(--ink);min-width:48px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{appearance:none;border:0;background:none;border-radius:999px;padding:5px 9px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;font:600 12.5px var(--ui)}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--ink)}
.seg.g button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.content{display:flex;flex-direction:column;gap:16px;min-width:0;padding-bottom:40px}
@media(max-width:1020px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none;padding:12px;gap:10px}
  .logo{flex-direction:row;justify-content:flex-start;text-align:left}
  .logo svg{width:34px;height:34px}.logo b{font-size:20px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav .grp{display:none}
  .nav button{flex:none;padding:7px 10px}
  .nav button.sub{padding-left:10px}
  .sidefoot{display:none}
  .top{position:static}
}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card>header{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.card>header .h{display:flex;align-items:center;gap:10px;min-width:0}
.card>header .h .ic{color:var(--accent)}
.card>header p{font-size:13px;color:var(--muted);max-width:70ch;margin-top:3px}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr)}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.g2,.g21,.g12,.g3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.g4{grid-template-columns:minmax(0,1fr)}.card{padding:14px}}
.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.note{font-size:12.5px;color:var(--muted);max-width:90ch;line-height:1.45}
.lead{font-size:14.5px;color:var(--ink2);max-width:80ch}

/* KPI */
.kpi{display:flex;gap:14px;align-items:center;padding:16px 18px}
.kpi .bub{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .bub.hot{background:var(--hot-soft);color:var(--hot)}
.kpi .bub.cold{background:var(--cold-soft);color:var(--cold)}
.kpi .bub.acc{background:var(--accent-soft);color:var(--accent)}
.kpi .bub.warn{background:var(--warn-soft);color:var(--warn)}
.kpi .bub.vio{background:var(--surface3);color:var(--violet)}
.kpi>div{min-width:0}
.kpi span{display:block;font-size:12.5px;color:var(--ink2);line-height:1.25}
.kpi b{display:block;font:600 25px/1.15 var(--display);letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi b small{font:600 14px var(--display);color:var(--ink2);margin-left:4px}
.kpi em{display:flex;gap:4px;align-items:center;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}
.kpi em.up{color:var(--good)}.kpi em.dn{color:var(--crit)}

/* hero */
.hero{position:relative;border-radius:18px;overflow:hidden;min-height:300px;border:1px solid var(--line);background:var(--surface2)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero .ov{position:absolute;inset:0;background:linear-gradient(90deg,var(--surface) 0%,var(--surface) 30%,transparent 72%);opacity:.94}
.hero .tx{position:relative;padding:34px 30px;max-width:560px;display:flex;flex-direction:column;gap:14px}
.hero .eyebrow{font:700 11.5px var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h2{font:600 30px/1.15 var(--display);letter-spacing:-.02em}
.hero h2 span{color:var(--accent)}
.hero p{color:var(--ink2);font-size:15px;max-width:46ch}
@media(max-width:640px){.hero .ov{background:var(--surface);opacity:.82}.hero h2{font-size:24px}.hero .tx{padding:22px 18px}}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile .ic{color:var(--accent)}
.tile h4{color:var(--accent)}
.tile b{font:600 20px/1.15 var(--display);letter-spacing:-.01em}
.tile b small{font:600 12.5px var(--display);color:var(--ink2);margin-left:3px}
.tile p{font-size:12.5px;color:var(--ink2);line-height:1.35}

/* etapas */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;padding:4px 0 2px}
.stepper button{appearance:none;background:none;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--muted);font:600 12.5px var(--ui);position:relative;padding:0 4px;text-align:center;line-height:1.25}
.stepper button::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--line2);z-index:0}
.stepper button:first-child::before{display:none}
.stepper button.done::before,.stepper button.cur::before{background:var(--accent)}
.stepper i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line2);background:var(--surface);font:700 13px var(--display);font-style:normal;position:relative;z-index:1;color:var(--ink2)}
.stepper .done i{border-color:var(--accent);color:var(--accent)}
.stepper .cur i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.stepper .cur{color:var(--ink)}
@media(max-width:640px){.stepper span{display:none}}
.wnav{display:flex;justify-content:space-between;gap:10px}

/* controles */
.btn{appearance:none;display:inline-flex;align-items:center;gap:8px;font:700 13.5px var(--ui);padding:9px 15px;border-radius:10px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.p{background:linear-gradient(90deg,var(--accent2),var(--accent));border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 18px rgba(46,181,101,.25)}
.btn.p:hover{filter:brightness(1.07)}
.btn.o{background:none;border-color:var(--accent);color:var(--accent)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.x{border:0;background:none;color:var(--muted);padding:2px 6px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input.n,input.t,textarea{font:500 13.5px var(--ui);color:var(--ink);background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:6px 9px}
input.n{font-family:var(--mono);font-size:13px;width:92px}
input.n.s{width:80px}input.n.xs{width:64px}input.n.w{width:110px}
input.n:disabled{opacity:.6}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0;align-content:start;grid-template-columns:minmax(0,1fr)}
.f>span{font:600 12.5px var(--ui);color:var(--ink2)}
.f em{font-style:normal;font-size:11.5px}
.fg{display:grid;gap:12px 14px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.fg .f input,.fg .f select{width:100%}
.prm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13.5px}
.prm label{color:var(--ink2)}
.prm input.n{width:120px}.prm select{width:190px;max-width:100%}
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;text-align:left;width:100%;appearance:none}
.opt:hover{border-color:var(--line2)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .rd{border-color:var(--accent)}
.opt[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.opt b{display:block;font:600 13.5px var(--ui);color:var(--ink)}
.opt p{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.opt .mt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px;font:500 12px var(--mono);color:var(--ink2)}
.info{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink2);line-height:1.45}
.info .ic{color:var(--cold);margin-top:1px}
.info.warn{background:var(--warn-soft);border-color:transparent}
.info.warn .ic{color:var(--warn)}
.info.ok{background:var(--good-soft);border-color:transparent}
.info.ok .ic{color:var(--good)}

/* tabelas */
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{font:700 11px var(--ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:bottom}
td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink2)}
td b{color:var(--ink)}
td.r,th.r{text-align:right}
td.m{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--ink)}
tr.hl td{background:var(--accent-soft)}
tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;color:var(--ink);border-top:1px solid var(--line2)}
.nt{text-transform:none}
.tag{font:500 11.5px var(--mono);background:var(--surface3);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 11.5px var(--ui);letter-spacing:.01em;padding:2px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}

<script>
'use strict';
/* Motor de cálculo do simulador Lins — sem dependências, roda no navegador e no Node. */
(function(root){
const LE={};
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
function interp(xs,ys,x){
  if(x<=xs[0])return ys[0];
  const n=xs.length;
  if(x>=xs[n-1])return ys[n-1];
  let i=1;while(x>xs[i])i++;
  const t=(x-xs[i-1])/(xs[i]-xs[i-1]);
  return ys[i-1]+t*(ys[i]-ys[i-1]);
}
function lmtd(a,b){
  if(!(a>0)||!(b>0))return NaN;
  if(Math.abs(a-b)<=1e-7*Math.max(a,b))return a;
  return (a-b)/Math.log(a/b);
}
LE.lmtd=lmtd;LE.interp=interp;

/* ---------- água e vapor ---------- */
const _T=[30,40,50,60,70,80,90,100,110,120,130,140];
const _H=[2429.8,2406.0,2382.0,2357.7,2333.0,2308.0,2282.5,2256.4,2229.6,2202.1,2173.7,2144.3];
const hfg=T=>interp(_T,_H,T);
function Tsat(P){
  const mm=P*750.062;
  const c=mm<760?[8.07131,1730.63,233.426]:[8.14019,1810.94,244.485];
  return c[1]/(c[0]-Math.log10(mm))-c[2];
}
LE.hfg=hfg;LE.Tsat=Tsat;
const hugot=Bx=>4.187*(1-0.006*Bx);
LE.hugot=hugot;

function propsWater(T){
  const rho=1000*(1-(T+288.9414)/(508929.2*(T+68.12963))*Math.pow(T-3.9863,2));
  const mu=2.414e-5*Math.pow(10,247.8/(T+273.15-140));
  const k=0.5706+1.756e-3*T-6.46e-6*T*T;
  return {rho,mu,k,cp:4186};
}
function props(s,T){
  if(s.fluid==='gas'){
    const P=(s.Pmean||5)*1e5,TK=T+273.15;
    const rho=P*0.04401/(8.314*TK);
    return {rho,mu:1.47e-5+4.6e-8*(T),k:0.0146+9e-5*T,cp:(s.cp||0.9)*1000};
  }
  const w=propsWater(T),Bx=s.Bx||0;
  return {rho:w.rho*(1+0.0039*Bx),mu:w.mu*Math.exp(0.033*Bx),k:w.k*(1-0.0054*Bx),cp:cpOf(s)*1000};
}
LE.props=props;
function cpOf(s){return s.cp!=null&&s.cp!==''?+s.cp:hugot(s.Bx||0);}
LE.cpOf=cpOf;
function CP(s){
  const dT=Math.abs(s.Tin-s.Tout);
  if(s.Qfix!=null)return dT>0?s.Qfix/dT:0;
  if(s.phase==='cond')return dT>0?(s.mTph/3.6*hfg(s.Tin))/dT:0;
  return s.mTph/3.6*cpOf(s);
}
LE.CP=CP;

/* ---------- método pinch ---------- */
function shiftOf(s,dT,mode){
  const f=mode==='individual'?(s.fdT??1):1;
  return (s.kind==='hot'?-1:1)*f*dT/2;
}
function activeStreams(streams){
  return streams.filter(s=>s.on&&CP(s)>0&&Math.abs(s.Tin-s.Tout)>1e-9);
}
function pta(streams,dT,mode='global'){
  const act=activeStreams(streams);
  const seg=act.map(s=>{
    const sh=shiftOf(s,dT,mode),a=s.Tin+sh,b=s.Tout+sh;
    return {s,hi:Math.max(a,b),lo:Math.min(a,b),cp:CP(s),sign:s.kind==='hot'?-1:1};
  });
  const ts=[...new Set(seg.flatMap(x=>[+x.hi.toFixed(6),+x.lo.toFixed(6)]))].sort((a,b)=>b-a);
  const rows=[];
  let R=0;const casc=[0];
  for(let i=0;i<ts.length-1;i++){
    const T1=ts[i],T2=ts[i+1],m=(T1+T2)/2;
    const on=seg.filter(x=>x.hi>=m&&x.lo<=m);
    const cpC=sum(on.filter(x=>x.sign>0),x=>x.cp),cpH=sum(on.filter(x=>x.sign<0),x=>x.cp);
    const dH=(cpC-cpH)*(T1-T2);
    R-=dH;casc.push(R);
    rows.push({T1,T2,dT:T1-T2,cpC,cpH,netCP:cpC-cpH,dH,ids:on.map(x=>x.s.id),R});
  }
  const minR=casc.length?Math.min(...casc):0;
  const QH=Math.max(0,-minR);
  const feas=casc.map(r=>r+QH);
  const QC=feas.length?feas[feas.length-1]:0;
  let pinch=null,pinchIdx=-1;
  feas.forEach((r,i)=>{if(pinch===null&&Math.abs(r)<1e-6){pinch=ts[i];pinchIdx=i;}});
  const threshold=pinch===null||pinchIdx===0||pinchIdx===feas.length-1;
  rows.forEach((r,i)=>{r.Rin=feas[i];r.Rout=feas[i+1];r.RinPre=casc[i];r.RoutPre=casc[i+1];});
  return {rows,ts,casc,feas,QH,QC,pinch,threshold,dT,mode,
    gcc:ts.map((t,i)=>({T:t,H:feas[i]})),act,
    pinchHot:pinch===null?null:pinch+dT/2,pinchCold:pinch===null?null:pinch-dT/2};
}
LE.pta=pta;

function composite(list){
  if(!list.length)return [];
  const ts=[...new Set(list.flatMap(x=>[+x.hi.toFixed(6),+x.lo.toFixed(6)]))].sort((a,b)=>a-b);
  const pts=[{T:ts[0],H:0}];let H=0;
  for(let i=0;i<ts.length-1;i++){
    const m=(ts[i]+ts[i+1])/2;
    const c=sum(list.filter(x=>x.hi>=m&&x.lo<=m),x=>x.cp);
    H+=c*(ts[i+1]-ts[i]);
    pts.push({T:ts[i+1],H});
  }
  return pts;
}
function composites(streams,QC){
  const act=activeStreams(streams);
  const mk=s=>({hi:Math.max(s.Tin,s.Tout),lo:Math.min(s.Tin,s.Tout),cp:CP(s)});
  const hot=composite(act.filter(s=>s.kind==='hot').map(mk));
  const cold=composite(act.filter(s=>s.kind==='cold').map(mk)).map(p=>({T:p.T,H:p.H+QC}));
  return {hot,cold};
}
LE.composites=composites;

/* Verificação independente: desloca a composta fria (com T deslocadas) até a distância vertical mínima zerar */
function graphicalQC(streams,dT,mode='global'){
  const act=activeStreams(streams);
  const mk=s=>{const sh=shiftOf(s,dT,mode),a=s.Tin+sh,b=s.Tout+sh;return {hi:Math.max(a,b),lo:Math.min(a,b),cp:CP(s)};};
  const hot=composite(act.filter(s=>s.kind==='hot').map(mk));
  const cold=composite(act.filter(s=>s.kind==='cold').map(mk));
  if(!hot.length||!cold.length)return null;
  const hH=hot.map(p=>p.H),hT=hot.map(p=>p.T);
  const cH=cold.map(p=>p.H),cT=cold.map(p=>p.T);
  const gap=QC=>{
    let g=Infinity;
    const Hs=[...hH,...cH.map(h=>h+QC)];
    for(const H of Hs){
      if(H<hH[0]-1e-9||H>hH[hH.length-1]+1e-9)continue;
      const c=H-QC;
      if(c<cH[0]-1e-9||c>cH[cH.length-1]+1e-9)continue;
      g=Math.min(g,interp(hH,hT,H)-interp(cH,cT,c));
    }
    return g;
  };
  let a=0,b=hH[hH.length-1]+1;
  if(gap(a)>=0)return {QC:0,QH:cH[cH.length-1]-hH[hH.length-1]};
  for(let i=0;i<80;i++){const m=(a+b)/2;if(gap(m)>=0)b=m;else a=m;}
  const QC=b;
  return {QC,QH:QC+cH[cH.length-1]-hH[hH.length-1]};
}
LE.graphicalQC=graphicalQC;

function gccAt(gcc,T){
  const asc=[...gcc].reverse();
  return interp(asc.map(p=>p.T),asc.map(p=>p.H),T);
}
/* Alocação de níveis no GCC: Qacum(L)=min{H(T*) ; T*>=T*_L} */
function placeLevels(p,levels,dT,mode='global',fSteam=1){
  const f=mode==='individual'?fSteam:1;
  const lv=[...levels].sort((a,b)=>a.Tsat-b.Tsat);
  let prev=0;const out=[];
  lv.forEach((L,i)=>{
    const Ts=L.Tsat-f*dT/2;
    let cum=Infinity;
    for(const q of p.gcc){if(q.T>=Ts)cum=Math.min(cum,q.H);}
    if(p.gcc.length&&Ts<=p.gcc[0].T)cum=Math.min(cum,gccAt(p.gcc,Ts));
    if(cum===Infinity)cum=p.QH;
    if(i===lv.length-1)cum=p.QH;
    const Q=Math.max(0,cum-prev);prev=Math.max(prev,cum);
    out.push({...L,Tstar:Ts,Q});
  });
  return out;
}
LE.placeLevels=placeLevels;

/* Alvo de área (fórmula de Bath) com curvas balanceadas */
function bath(streams,placed,QC,cw){
  const act=activeStreams(streams);
  const hotS=act.filter(s=>s.kind==='hot').map(s=>({hi:s.Tin,lo:s.Tout,cp:CP(s),h:s.h||2500,id:s.id}));
  placed.filter(L=>L.Q>1e-6).forEach(L=>hotS.push({hi:L.Tsat+0.5,lo:L.Tsat-0.5,cp:L.Q,h:L.h||6000,id:L.id}));
  const coldS=act.filter(s=>s.kind==='cold').map(s=>({hi:s.Tout,lo:s.Tin,cp:CP(s),h:s.h||2500,id:s.id}));
  if(QC>1e-6)coldS.push({hi:cw.Tout,lo:cw.Tin,cp:QC/(cw.Tout-cw.Tin),h:cw.h||3500,id:'CW'});
  const H=composite(hotS),C=composite(coldS);
  if(!H.length||!C.length)return {A:0,rows:[]};
  const hH=H.map(p=>p.H),hT=H.map(p=>p.T),cH=C.map(p=>p.H),cT=C.map(p=>p.T);
  const top=Math.min(hH[hH.length-1],cH[cH.length-1]);
  const Hs=[...new Set([...hH,...cH].filter(x=>x<=top+1e-6).map(x=>+x.toFixed(4)))].sort((a,b)=>a-b);
  let A=0,bad=0;const rows=[];
  for(let i=0;i<Hs.length-1;i++){
    const a=Hs[i],b=Hs[i+1];if(b-a<1e-6)continue;
    const Th1=interp(hH,hT,a),Th2=interp(hH,hT,b),Tc1=interp(cH,cT,a),Tc2=interp(cH,cT,b);
    const d1=Th1-Tc1,d2=Th2-Tc2,lm=lmtd(d1,d2);
    if(!(lm>0)){bad++;continue;}
    const hm=(Th1+Th2)/2,cm=(Tc1+Tc2)/2;
    let s=0;
    hotS.forEach(x=>{if(x.hi>=hm&&x.lo<=hm)s+=x.cp*(Th2-Th1)*1000/x.h;});
    coldS.forEach(x=>{if(x.hi>=cm&&x.lo<=cm)s+=x.cp*(Tc2-Tc1)*1000/x.h;});
    const dA=s/lm;A+=dA;rows.push({a,b,Th1,Th2,Tc1,Tc2,lm,dA});
  }
  return {A,rows,bad};
}
LE.bath=bath;

function unitsTarget(p,placed,QC){
  const act=p.act;let above=0,below=0;
  const pc=p.pinch;
  if(pc===null)return {above:0,below:act.length,N:Math.max(1,act.length)};
  act.forEach(s=>{
    const sh=shiftOf(s,p.dT,p.mode),hi=Math.max(s.Tin,s.Tout)+sh,lo=Math.min(s.Tin,s.Tout)+sh;
    if(hi>pc+1e-9)above++;
    if(lo<pc-1e-9)below++;
  });
  const nHotU=placed.filter(L=>L.Q>1e-6).length,nCU=QC>1e-6?1:0;
  const Na=Math.max(0,above+nHotU-1),Nb=Math.max(0,below+nCU-1);
  return {above:Na,below:Nb,N:Na+Nb};
}
LE.unitsTarget=unitsTarget;

/* ---------- geometria: correlações ---------- */
/* Kumar (1984), em Kakaç et al., Heat Exchangers: Selection, Rating and Thermal Design */
const KH={30:[[10,.718,.349],[1e12,.348,.663]],45:[[10,.718,.349],[100,.400,.598],[1e12,.300,.663]],
 50:[[20,.630,.333],[300,.291,.591],[1e12,.130,.732]],60:[[20,.562,.326],[400,.306,.529],[1e12,.108,.703]],
 65:[[20,.562,.326],[500,.331,.503],[1e12,.087,.718]]};
const KF={30:[[10,50,1],[100,19.40,.589],[1e12,2.990,.183]],45:[[15,47,1],[300,18.29,.652],[1e12,1.441,.206]],
 50:[[20,34,1],[300,11.25,.631],[1e12,.772,.161]],60:[[40,24,1],[400,3.24,.457],[1e12,.760,.215]],
 65:[[50,24,1],[500,2.80,.451],[1e12,.639,.213]]};
function pick(tbl,Re){for(const r of tbl)if(Re<=r[0])return r;return tbl[tbl.length-1];}
function pheSide(m,p,g){
  const Ncp=(g.Nt-1)/(2*g.Np),De=2*g.b/g.phi,Ach=g.b*g.w;
  const G=m/(g.Npar*Ncp*Ach),v=G/p.rho,Re=G*De/p.mu,Pr=p.cp*p.mu/p.k;
  const ch=pick(KH[g.beta]||KH[60],Re),cf=pick(KF[g.beta]||KF[60],Re);
  const Nu=ch[1]*Math.pow(Re,ch[2])*Math.cbrt(Pr),h=Nu*p.k/De,f=cf[1]/Math.pow(Re,cf[2]);
  const dPc=4*f*(g.Lp*g.Np/De)*G*G/(2*p.rho);
  const Gp=m/(g.Npar*Math.PI/4*g.Dp*g.Dp),vp=Gp/p.rho,dPp=1.4*g.Np*Gp*Gp/(2*p.rho);
  return {Ncp,De,G,v,Re,Pr,Nu,h,f,dPc,dPp,dP:dPc+dPp,vp,Ch:ch[1],y:ch[2],Kp:cf[1],mf:cf[2],...p};
}
function tubeSide(m,p,g){
  const At=Math.PI/4*g.Di*g.Di*g.Nt/g.Np,v=m/(g.Npar*p.rho*At),Re=p.rho*v*g.Di/p.mu,Pr=p.cp*p.mu/p.k;
  let f,Nu,corr;
  if(Re>=3000){f=Math.pow(0.79*Math.log(Re)-1.64,-2);Nu=(f/8)*(Re-1000)*Pr/(1+12.7*Math.sqrt(f/8)*(Math.pow(Pr,2/3)-1));corr='Gnielinski';}
  else{f=64/Re;Nu=3.66;corr='laminar';}
  const h=Nu*p.k/g.Di,dP=g.Np*(f*g.L/g.Di+4)*p.rho*v*v/2;
  return {v,Re,Pr,Nu,h,f,dP,corr,...p};
}
function shellSide(m,p,g){

/* Dimensionamento: ajusta o nº de placas (PHE) ou de tubos (casco-tubos) até fornecer o UA pedido */
function sizeFor(ex,hs,cs,Th,Tc,UAreq,dPmax=(LE.dPmax??100)*1e3){
  const set=(N)=>{
    const g={...ex.geom};

    if(ex.type!=='PHE'){g.Ds=g.Do*Math.pow(N/0.249,1/2.207)+0.05;}
    return g;
  };
  const ok=N=>{const r=rate({...ex,geom:set(N)},hs,cs,Th,Tc);return r.UA>=UAreq&&Math.max(r.hot.dP||0,r.cold.dP||0)<=dPmax;};
  let a=ex.type==='PHE'?11:10,b=ex.type==='PHE'?1401:8000;
  if(!ok(b))return {Nt:b,geom:set(b),short:true};
  while(b-a>1){const m=Math.floor((a+b)/2);if(ok(m))b=m;else a=m;}
  let N=b;if(ex.type==='PHE'&&N%2===0)N+=1;

LE.sizeFor=sizeFor;
function effectiveness(NTU,Rc,flow){
  if(flow==='1-2'){
    const e=Math.sqrt(1+Rc*Rc),x=Math.exp(-NTU*e);
    return 2/((1+Rc)+e*(1+x)/(1-x));
  }

LE.effectiveness=effectiveness;
function Ffactor(Th1,Th2,Tc1,Tc2){
  const R=(Th1-Th2)/Math.max(1e-9,Tc2-Tc1),P=(Tc2-Tc1)/Math.max(1e-9,Th1-Tc1);
  if(P<=0||P>=1)return 1;
  const s=Math.sqrt(R*R+1);
  if(Math.abs(R-1)<1e-6){const q=2-P*(2-s),w=2-P*(2+s);return w>0&&q>0?(s*P/(1-P))/Math.log(q/w):0.5;}

  const S=Math.log(W),a=2/P-1-R;

/* ---------- cadeia do CO2 ---------- */
function co2Chain(c){
  const m=c.mTotal*c.frac/3.6,n=Math.max(1,Math.round(c.stages));
  const r=Math.pow(c.Pfinal/c.Pin,1/n),eE=(c.k-1)/c.k;
  const stages=[];let W=0,Q=0;
  for(let i=0;i<n;i++){
    const T1=(i===0?c.Tin:c.Tic)+273.15;
    const T2s=T1*Math.pow(r,eE),T2=T1+(T2s-T1)/c.etaIs;
    const w=m*c.cp*(T2-T1),q=m*c.cp*(T2-(c.Tic+273.15));
    W+=w;Q+=Math.max(0,q);
    stages.push({i:i+1,T1:T1-273.15,T2:T2-273.15,w,q,P1:c.Pin*Math.pow(r,i),P2:c.Pin*Math.pow(r,i+1)});
  }
  const Tmax=Math.max(...stages.map(s=>s.T2));
  const Tev=c.Tcond-c.dTevap,TevK=Tev+273.15,TrK=c.Trej+273.15;
  const copC=TevK/(TrK-TevK),COP=copC*c.etaCarnot;
  const qEsp=c.cp*(c.Tic-c.Tcond)+c.hfgCO2;
  const Qref=m*qEsp,Wref=Qref/COP,Waux=(W+Wref)*c.fAux;
  const Wtot=W+Wref+Waux,tph=m*3.6,kWht=tph>0?Wtot/tph:0;
  const Qrej=Qref+Wref;
  const stream={id:'H6',name:'Compressão do CO₂',kind:'hot',group:'CO₂',mTph:tph,cp:c.cp,Tin:Tmax,Tout:c.Tic,Qfix:Q,fluid:'gas',
    Pmean:Math.sqrt(c.Pin*c.Pfinal),mEq:tph*n,h:300,Rf:1.7e-4,on:!!c.integrate&&Q>0,fdT:2,src:'Calculada (aba CO₂)',flag:'calc',resid:'tower'};
  return {m,tph,r,stages,W,Q,Tmax,Tev,COP,copC,qEsp,Qref,Wref,Waux,Wtot,kWht,Qrej,stream,tpd:tph*24};
}
LE.co2Chain=co2Chain;
function kremser(c,G_tph){
  const L=c.Lm3h*1000/18.015,G=G_tph*1000/44.01;           /* kmol/h */
  const A=L/(c.K*G),N=c.Ntrays*c.etaTray;
  const rec=Math.abs(A-1)<1e-9?N/(N+1):(Math.pow(A,N+1)-A)/(Math.pow(A,N+1)-1);
  const mEt=G_tph*1000*c.wEt/100,rEt=mEt*rec;
  const gl=rEt/0.789/(c.Lm3h*1000+rEt/0.789)*100;
  const rhoG=c.Pcol*1e5*0.04401/(8.314*(c.Tcol+273.15)),Vg=G_tph*1000/rhoG/3600;
  const uF=c.Fs/Math.sqrt(rhoG),Dmin=Math.sqrt(4*Vg/(Math.PI*uF));
  const Dl=c.Dline*0.0254,uL=Vg/(Math.PI/4*Dl*Dl);

LE.kremser=kremser;

/* ---------- rede de trocadores ---------- */
function groupBy(list,key){
  const m=new Map();
  list.forEach(e=>{const k=e[key];if(!m.has(k))m.set(k,[]);m.get(k).push(e);});
  return [...m.keys()].sort((a,b)=>a-b).map(k=>m.get(k));
}
function solveNet(streams,exs,opt={}){
  const by=Object.fromEntries(streams.map(s=>[s.id,s]));
  const list=exs.filter(e=>e.on!==false&&by[e.hot]&&by[e.cold]&&by[e.hot].on&&by[e.cold].on);
  const st=new Map(list.map(e=>[e,{Q:0,Thi:by[e.hot].Tin,Tci:by[e.cold].Tin}]));
  const CPs=Object.fromEntries(streams.map(s=>[s.id,CP(s)]));
  const hotG={},coldG={};
  streams.forEach(s=>{
    if(s.kind==='hot')hotG[s.id]=groupBy(list.filter(e=>e.hot===s.id),'posH');
    else{coldG[s.id]=groupBy(list.filter(e=>e.cold===s.id&&!e.top),'posC');}
  });
  const tops={};list.filter(e=>e.top).forEach(e=>{(tops[e.cold]=tops[e.cold]||[]).push(e);});
  let err=1e9,it=0;
  for(it=0;it<600&&err>1e-4;it++){
    Object.entries(hotG).forEach(([id,gs])=>{
      let T=by[id].Tin;
      gs.forEach(g=>{g.forEach(e=>{st.get(e).Thi=T;});T-=sum(g,e=>st.get(e).Q/(e.eta??1))/CPs[id];});
    });
    Object.entries(coldG).forEach(([id,gs])=>{
      let T=by[id].Tin;
      gs.forEach(g=>{g.forEach(e=>{st.get(e).Tci=T;});T+=sum(g,e=>st.get(e).Q)/CPs[id];});
    });
    Object.entries(tops).forEach(([id,es])=>{
      const Ql=sum(es,e=>st.get(e).Q);
      es.forEach(e=>{st.get(e).Tci=by[id].Tout-Ql/CPs[id];});
    });
    err=0;
    list.forEach(e=>{
      const v=st.get(e),hs=by[e.hot],cs=by[e.cold],eta=e.eta??1;
      const Ch=CPs[e.hot]*(e.fH??1),Cc=CPs[e.cold]*(e.fC??1);
      let Qn;
      const dTin=v.Thi-v.Tci;
      const Cmin=Math.min(Ch,Cc),Cmax=Math.max(Ch,Cc);
      if(e.spec==='Q'){Qn=e.Q;}
      else if(e.spec==='Tho'){Qn=eta*Ch*Math.max(0,v.Thi-e.Tho);}
      else if(e.spec==='dT'){
        const dt=e.dT??opt.dT??10;
        Qn=Math.max(0,Math.min(eta*Ch*(v.Thi-v.Tci-dt),Cc*(v.Thi-dt-v.Tci)));
      }
      else{
        let UA=e.UA,flow='contra';
        if(e.spec==='geom'){

      }
      let lim=Infinity,why='';
      if(cs.Tout>v.Tci){const l=Cc*(cs.Tout-v.Tci);if(l<lim){lim=l;why='alvo frio';}}else{lim=0;why='alvo frio';}
      const lh=eta*Ch*(v.Thi-hs.Tout);if(lh<lim){lim=Math.max(0,lh);why='alvo quente';}
      const lt=eta*Cmin*Math.max(0,dTin);if(e.spec==='Q'&&lt<lim){lim=lt;why='limite térmico';}
      v.limited=Qn>lim+1e-6?why:'';
      Qn=Math.min(Qn,lim);

    const v=st.get(e),eta=e.eta??1,Ch=CPs[e.hot]*(e.fH??1),Cc=CPs[e.cold]*(e.fC??1);
    const Tho=v.Thi-(v.Q/eta)/Ch,Tco=v.Tci+v.Q/Cc;

    }
  });
  return {res,ends,iters:it,err};
}
LE.solveNet=solveNet;

function ladder(S,s,Tstart,Ttarget,cp){
  const lv=S.levelsT,mode=S.net.ladder,cuts=(S.net.cuts||{})[s.id]||{};
  if(s.onlyLevel){
    const L=lv.find(l=>l.id===s.onlyLevel);
    return L&&Ttarget>Tstart+1e-9?[{L,Ti:Tstart,Te:Ttarget,Q:cp*(Ttarget-Tstart)}]:[];
  }
  const segs=[];let T=Tstart;
  for(let i=0;i<lv.length&&T<Ttarget-1e-9;i++){
    const L=lv[i],last=i===lv.length-1;
    let Tmax=mode==='pdf'?(cuts[L.id]??-Infinity):L.Tsat-(S.net.dTap??S.dTmin);
    if(last&&mode!=='pdf')Tmax=Infinity;
    if(mode==='pdf'&&L.id==='VV1')Tmax=Infinity;
    if(Tmax>T){
      const Te=Math.min(Tmax,Ttarget),Q=cp*(Te-T);
      segs.push({L,Ti:T,Te,Q});T=Te;
    }
  }
  return segs;
}
function evaporator(ev,x){
  const x1=x.VV1+ev.dest,x2=x.VV2+ev.pans,x3=x.VV3;
  const V1=(ev.E+4*x1+3*x2+2*x3)/5,V2=V1-x1,V3=V2-x2,V4=V3-x3,V5=V4;
  return {x1,x2,x3,V1,V2,V3,V4,V5,Esc:ev.k*V1,cdvgEvap:V3+2*V4};
}
LE.evaporator=evaporator;

function capexHX(A,type,c){
  if(!(A>0))return 0;
  const k=type==='ST'?c.st:c.phe;
  return (k[0]+k[1]*Math.pow(A,k[2]))*c.fx*c.fInst;

LE.capexHX=capexHX;

function simulate(S,opts={}){
  const co2on=!!(S.co2.on&&!opts.base);
  const chain=co2Chain(S.co2);
  const streams0=S.streams.map(s=>({...s}));
  const vin=streams0.find(s=>s.id==='C4');
  if(vin&&vin.on&&S.dest){const h1=streams0.find(s=>s.id==='H1');if(h1&&h1.on)h1.Tin=S.dest.Tvinhaca;}
  if(co2on&&chain.stream.on)streams0.push({...chain.stream});
  let streams=streams0;
  const net=opts.base?S.baseNet:S.net;
  const Sx={...S,net};
  let cdvg=streams.find(s=>s.id==='H2').mTph,nr=null,evap=null,sg=null,xHeat=null,steamUse=null,mCol=0;
  for(let pass=0;pass<30;pass++){
    streams=streams.map(s=>s.id==='H2'?{...s,mTph:cdvg}:s);
    nr=solveNet(streams,net.exchangers,{dT:S.dTmin});
    const by=Object.fromEntries(streams.map(s=>[s.id,s]));
    sg=[];
    streams.filter(s=>s.kind==='cold'&&s.on).forEach(s=>{
      const e=nr.ends[s.id],cp=CP(s);
      ladder(Sx,s,e.Tend,e.Ttarget,cp).forEach(x=>sg.push({...x,cold:s.id,cp}));
    });
    xHeat={VV1:0,VV2:0,VV3:0,VE:0};steamUse={};
    sg.forEach(x=>{
      const s=by[x.cold],eta=s.etaSteam??0.95,mm=x.Q/(x.L.lambda*eta)*3.6;
      x.m=mm;xHeat[x.L.id]+=mm;
    });
    mCol=sum(sg.filter(x=>by[x.cold]&&by[x.cold].onlyLevel),x=>x.m);
    const adj=opts.base?mCol:(opts.destAdj||0);
    evap=evaporator({...S.evap,dest:S.evap.dest-adj},xHeat);
    let vfl=0;nr.res.forEach(r=>{if(r.e.hot==='H5')vfl+=r.Qh/hfg(by.H5.Tin)*3.6;});
    const nc=evap.cdvgEvap+S.evap.pans+xHeat.VV1+xHeat.VV2+xHeat.VV3-mCol+vfl+(S.evap.cdvgOther||0);
    if(!S.net.coupleCDVG&&!opts.base){break;}
    const target=opts.base?cdvg:nc;
    if(Math.abs(target-cdvg)<1e-3)break;
    cdvg=cdvg+0.7*(target-cdvg);
  }
  const by=Object.fromEntries(streams.map(s=>[s.id,s]));
  const Qheat=sum(sg,x=>x.Q);
  let Qcool=0,Qvent=0,Qcarry=0,Qco2=0;const cools=[];
  streams.filter(s=>s.kind==='hot'&&s.on).forEach(s=>{
    const q=nr.ends[s.id].resQ;
    if(s.id==='H5'){Qvent+=Math.max(0,q);cools.push({s,q,to:'vent'});}
    else if(s.id==='H2'){Qcarry+=Math.max(0,q);cools.push({s,q,to:'carry'});}
    else if(s.id==='H6'){Qco2+=Math.max(0,q);cools.push({s,q,to:'co2'});}
    else if(s.group==='Candidatas'){Qcool+=0;cools.push({s,q,to:'none'});}
    else{Qcool+=Math.max(0,q);cools.push({s,q,to:'tower'});}
  });

  return {streams,by,net:nr,sg,xHeat,evap,Escape,Qheat,Qcool,Qvent,Qcarry,Qco2,cools,Qrec,cdvg,chain,co2on,mCol};
}
LE.simulate=simulate;

function evaluate(S){
  LE.rfPHE=S.econ.rfPHE??1;LE.dPmax=S.econ.dPmax??100;
  const levelsT=S.steam.levels.map(l=>{const Tsat=LE.Tsat(l.P);return {...l,Tsat,lambda:hfg(Tsat)};}).sort((a,b)=>a.Tsat-b.Tsat);
  const Sx={...S,levelsT};
  const base=simulate(Sx,{base:true}),prop=simulate(Sx,{destAdj:base.mCol});
  const baseUA=Object.fromEntries(base.net.res.map(x=>[x.e.id,x.UA]));
  /* pinch sobre as correntes do cenário */
  const pS=prop.streams.map(s=>{const o=S.streams.find(x=>x.id===s.id);return o?{...s,mTph:o.mTph}:s;});
  const p=pta(pS,S.dTmin,S.shiftMode);
  const g=graphicalQC(pS,S.dTmin,S.shiftMode);
  const placed=placeLevels(p,levelsT,S.dTmin,S.shiftMode,0.5);
  const b=bath(pS,placed,p.QC,S.cw);
  const units=unitsTarget(p,placed,p.QC);
  const comp=composites(pS,p.QC);
  /* vapor e bagaço */
  const v=S.boiler,dEsc=base.Escape-prop.Escape;
  const dEscCap=Math.min(dEsc,v.prvOut);
  const dVM=dEscCap*v.prvIn/v.prvOut,dBag=dVM/v.kgVkgB;
  const dQtower=(base.Qcool-prop.Qcool)/1000;              /* MW */
  const dV5=prop.evap.V5-base.evap.V5,dQcond=dV5/3.6*hfg(S.evap.T5)/1000; /* MW */
  const co2Cool=prop.co2on?prop.chain.Qrej/1000:0;
  const econ=S.econ,h=econ.hours;
  /* capex de trocadores e bombeamento */
  let Anew=0,capHX=0,kWp=0;
  const exRows=prop.net.res.map(r=>{
    const e=r.e;let Aadd=0,Atot=0,cost=0;
    const UAb=e.UAbase??baseUA[e.id];
    if(r.r){Atot=r.r.A;Aadd=e.isNew?Atot:Math.max(0,Atot-(UAb||0)*1000/(e.Uref||1200));}
    else{const U=e.Uref||1200;Atot=r.UA*1000/U;Aadd=e.isNew?Atot:Math.max(0,(r.UA-(UAb??r.UA))*1000/U);}
    cost=capexHX(Aadd,e.type||'PHE',econ);
    Anew+=Aadd;capHX+=cost;
    let kw=0;
    if(r.r&&e.isNew){
      const hs=prop.by[e.hot],cs=prop.by[e.cold];
      const Vh=(hs.fluid==='steam'||hs.mTph==null)?0:((hs.mEq??hs.mTph)/3.6*(e.fH??1)/(r.r.hot.rho||1000));
      const Vc=(cs.mTph/3.6*(e.fC??1))/(r.r.cold.rho||1000);
      kw=(Vh*(r.r.hot.dP||0)+Vc*(r.r.cold.dP||0))/econ.etaPump/1000;
    }
    kWp+=kw;
    return {...r,Aadd,Atot,cost,kw};
  });
  /* aquecedores a vapor: área além da existente (referência = cenário atual) */
  const heaterArea=(sim)=>{
    const m={};
    sim.sg.forEach(x=>{
      const Tv=x.L.Tsat,lm=lmtd(Tv-x.Ti,Tv-x.Te);
      const A=lm>0?x.Q*1000/(econ.Uheater*lm):0;
      const k=x.cold+'|'+x.L.id;m[k]=(m[k]||0)+A;
    });
    return m;
  };
  const ha0=heaterArea(base),ha1=heaterArea(prop),heatRows=[];
  Object.entries(ha1).forEach(([k,A])=>{
    const add=Math.max(0,A-(ha0[k]||0));
    if(add>1e-6){const c=capexHX(add,'ST',econ);capHX+=c;Anew+=add;heatRows.push({k,A,A0:ha0[k]||0,add,c});}
  });
  const rBag=dBag*h*econ.pBag;
  const rTower=(dQtower-dQcond-0)*h*econ.pCool;
  const dWater=dQtower*S.evap.wTower2-dQcond*S.evap.wTower3;
  const rWater=dWater*h*econ.pWater;
  const rPump=-(kWp/1000)*h*econ.pEl;
  const savH=rBag+rTower+rWater+rPump;
  const omH=capHX*econ.omHX;
  const netH=savH-omH;
  const ch=prop.chain;
  let revCO2=0,opCO2=0,capCO2=0;
  if(prop.co2on){
    revCO2=ch.tph*h*econ.pCO2;
    opCO2=(ch.Wtot/1000)*h*econ.pEl+((ch.Qrej+prop.Qco2)/1000)*h*econ.pCool;
    capCO2=econ.co2Cap*econ.fx*Math.pow(ch.tph/econ.co2CapRef,econ.co2Exp);
    opCO2+=capCO2*econ.omCO2;
  }
  const netCO2=revCO2-opCO2;
  const CAPEX=capHX+capCO2,net=netH+netCO2;
  const arf=econ.i*Math.pow(1+econ.i,econ.n)/(Math.pow(1+econ.i,econ.n)-1);
  const npv=-CAPEX+net/arf;
  let irr=null;
  if(CAPEX>0&&net>0){
    let a=-0.9,b=20;const f=r=>-CAPEX+net*(1-Math.pow(1+r,-econ.n))/r;
    for(let i=0;i<200;i++){const m=(a+b)/2;if(f(m)>0)a=m;else b=m;}
    irr=(a+b)/2;
  }
  const payback=net>0?CAPEX/net:Infinity;
  const paybackH=netH>0?capHX/netH:Infinity;
  /* super-alvo */
  const steamVal=econ.pBag*(v.prvIn/v.prvOut)/v.kgVkgB*S.evap.k;           /* R$/t de V1 evitado */
  const utilCost=(pl,QC)=>{
    let c=0;pl.forEach(L=>{const mt=L.Q/L.lambda/0.95*3.6;c+=mt*L.w*(L.id==='VE'?1:1)*steamVal*h;});
    return c+QC/1000*h*econ.pCool;
  };
  const scan=[];
  if(!S.noScan){
    for(let d=3;d<=30;d++){
      const pp=pta(pS,d,S.shiftMode),pl=placeLevels(pp,levelsT,d,S.shiftMode,0.5),bb=bath(pS,pl,pp.QC,S.cw),u=unitsTarget(pp,pl,pp.QC);
      const N=Math.max(1,u.N),cap=N*capexHX(bb.A/N,'PHE',econ),ua=utilCost(pl,pp.QC);
      scan.push({d,QH:pp.QH,QC:pp.QC,A:bb.A,N,cap,capAn:cap*arf,util:ua,tac:cap*arf+ua});
    }
  }
  const best=scan.length?scan.reduce((a,b)=>b.tac<a.tac?b:a):null;
  /* limites de evaporação */
  const evRows=[['Pré',prop.evap.V1,base.evap.V1,12000],['2º',prop.evap.V2,base.evap.V2,8000],['3º',prop.evap.V3,base.evap.V3,4000],['4º',prop.evap.V4,base.evap.V4,2000],['5º',prop.evap.V5,base.evap.V5,2000]]
    .map(([n,a,b,A])=>({n,V:a,V0:b,A,rate:a*1000/A,rate0:b*1000/A}));
  /* regras do pinch */
  const p2=pta(prop.streams,S.dTmin,S.shiftMode);
  const pinchRules=crossPinch(prop,p2);
  pinchRules.QHcoupled=p2.QH;
  /* potencial: vapor se a rede atingisse o alvo */
  const xT={VV1:0,VV2:0,VV3:0,VE:0};
  placed.forEach(L=>{xT[L.id]=(xT[L.id]||0)+L.Q/(L.lambda*0.95)*3.6;});
  const evT=evaporator({...S.evap,dest:S.evap.dest-base.mCol},xT),escT=evT.Esc+xT.VE;
  /* alvos do Cenário A (correntes do PMS, sem a planta de CO2) e fechamento do cenário atual */
  const pAS=base.streams.map(s=>{const o=S.streams.find(x=>x.id===s.id);return o?{...s,mTph:o.mTph}:s;});
  const pA=pta(pAS,S.dTmin,S.shiftMode);
  const baseRules=crossPinch(base,pA);
  const idBase={lhs:base.Qheat-pA.QH,cross:baseRules.cross,heatBelow:baseRules.heatBelow,coolAbove:baseRules.coolAbove,losses:sum(base.net.res,x=>x.Qh-x.Q)};
  idBase.rhs=idBase.cross+idBase.heatBelow+idBase.coolAbove+idBase.losses;
  /* exergia */
  const T0=(S.env&&S.env.T0)??25;
  const exT=exergyTarget(pS,p.QC,T0),exA=exergyNet(base,S,T0),exB=exergyNet(prop,S,T0);
  /* ambiente */
  const env=S.env||{},fuelEF={none:0,gn:56.1,oc:77.4}[env.fuel||'gn']??0;
  const envM={bagAno:dBag*h,co2Bag:dBag*h*(env.lhvBag??7.5)*fuelEF/1000,waterAno:dWater*h,
    co2Cap:prop.co2on?prop.chain.tph*h:0,co2El:prop.co2on?(prop.chain.Wtot/1000)*h*(env.efGrid??0.03):0,
    co2Pump:(kWp/1000)*h*(env.efGrid??0.03),fuelEF};
  envM.co2Avoid=envM.co2Bag-envM.co2Pump;
  const recMV=sum(prop.net.res.filter(x=>x.e.hot==='H3'&&x.e.cold==='C4'),x=>x.Q)/1000;
  const metrics={
    QHmin:p.QH/1000,QCmin:p.QC/1000,Tpinch:p.pinch,Thot:p.pinchHot,Tcold:p.pinchCold,
    QHbase:base.Qheat/1000,QHnet:prop.Qheat/1000,QCnet:prop.Qcool/1000,QCbase:base.Qcool/1000,
    Qrec:prop.Qrec/1000,QrecBase:base.Qrec/1000,dQrec:(prop.Qrec-base.Qrec)/1000,
    dEsc,dEscCap,Escape:prop.Escape,EscapeBase:base.Escape,kgtc:(prop.Escape)*1000/S.moagem,dVM,dBag,
    Anew,capHX,capCO2,CAPEX,savH,netH,netCO2,revCO2,net,npv,irr,payback,paybackH,Atarget:b.A,Ntarget:units.N,dWater,
    dTopt:best?best.d:null,dEscTarget:base.Escape-escT,
    npvH:-capHX+netH/arf,share:(base.Qheat-prop.Qheat)/Math.max(1,base.Qheat-p.QH),
    vmtc:(S.boiler.vm-dVM)*1000/S.moagem,vmtc0:S.boiler.vm*1000/S.moagem,
    prvLeft:v.prvIn-dVM,mwPRV:(v.prvIn-dVM)/v.tMW,
    QHminA:pA.QH/1000,QCminA:pA.QC/1000,pot:(base.Qcool-pA.QC)/1000,metaBal:(base.Qheat-(base.Qcool-pA.QC))/1000,
    recMV,dQH:(base.Qheat-prop.Qheat)/1000,dQC:(base.Qcool-prop.Qcool)/1000,
    exA:exA.total,exB:exB.total,exT:exT.loss,co2Avoid:envM.co2Avoid,waterAno:envM.waterAno,co2Cap:envM.co2Cap,dTmin:S.dTmin,
  };
  return {S:Sx,levelsT,base,prop,p,g,placed,b,units,comp,exRows,evRows,scan,best,pinchRules,metrics,arf,steamVal,pA,idBase,exT,exA,exB,envM,T0,
    heatRows,flows:{rBag,rTower,rWater,rPump,omH,revCO2,opCO2,dQtower,dQcond,co2Cool,kWp,dWater}};
}
LE.evaluate=evaluate;

function crossPinch(sim,p){
  if(p.pinch===null)return {cross:0,heatBelow:0,coolAbove:0,rows:[]};
  const Tph=p.pinchHot,Tpc=p.pinchCold;let cross=0;const rows=[];
  sim.net.res.forEach(r=>{
    const sc=Math.min(r.Q,Math.max(0,(Tpc-r.Tci)*r.Cc));          /* parcela com frio abaixo do pinch */
    const sh=Math.min(r.Q,Math.max(0,(Tph-r.Tho)*r.Ch*(r.e.eta??1))); /* parcela com quente abaixo do pinch */
    const q=Math.max(0,sc-sh);
    if(q>1e-6)rows.push({id:r.e.id,q});
    cross+=q;
  });
  let heatBelow=0;
  sim.sg.forEach(x=>{heatBelow+=Math.max(0,Math.min(x.Te,Tpc)-x.Ti)*x.cp;});
  let coolAbove=0;
  sim.cools.forEach(c=>{
    if(c.to!=='none'){
      const cp=CP(c.s),Te=c.s.Tout+c.q/cp;
      coolAbove+=Math.max(0,Te-Math.max(c.s.Tout,Tph))*cp;
    }
  });
  return {cross,heatBelow,coolAbove,rows};
}
LE.crossPinch=crossPinch;

/* ---------- exergia ---------- */
const carnot=(T,T0)=>1-(T0+273.15)/(T+273.15);
const Tbar=(a,b)=>{const A=a+273.15,B=b+273.15;return Math.abs(A-B)<1e-6?A:(A-B)/Math.log(A/B);};
LE.carnot=carnot;LE.Tbar=Tbar;
function dense(pts,T0){
  const out=[];
  pts.forEach((p,i)=>{
    if(i){const q=pts[i-1];for(let k=1;k<=8;k++){const t=k/8,T=q.T+(p.T-q.T)*t,H=q.H+(p.H-q.H)*t;out.push({H,T,eta:carnot(T,T0)});}}
    else out.push({H:p.H,T:p.T,eta:carnot(p.T,T0)});
  });
  return out;
}
function exergyTarget(streams,QC,T0){
  const c=composites(streams,QC);
  if(!c.hot.length||!c.cold.length)return {loss:0,a:0,b:0,hot:[],cold:[]};
  const hH=c.hot.map(p=>p.H),hT=c.hot.map(p=>p.T),cH=c.cold.map(p=>p.H),cT=c.cold.map(p=>p.T);
  const a=Math.max(hH[0],cH[0]),b=Math.min(hH[hH.length-1],cH[cH.length-1]);
  let loss=0;const n=600;
  if(b>a)for(let i=0;i<n;i++){const H=a+(b-a)*(i+.5)/n;loss+=(carnot(interp(hH,hT,H),T0)-carnot(interp(cH,cT,H),T0))*(b-a)/n;}
  return {loss,a,b,hot:dense(c.hot,T0),cold:dense(c.cold,T0)};
}
LE.exergyTarget=exergyTarget;
function exergyNet(sim,S,T0){
  const T0K=T0+273.15,o={rec:0,heat:0,cool:0,vent:0,steamEx:0,rows:[]};
  sim.net.res.forEach(r=>{
    if(r.Q<1)return;
    const hs=sim.by[r.e.hot],Th=(hs.fluid==='steam'||hs.phase==='cond')?hs.Tin+273.15:Tbar(r.Thi,r.Tho),Tc=Tbar(r.Tci,r.Tco);
    const d=T0K*(r.Q/Tc-r.Qh/Th)+r.Qh-r.Q-(r.Qh-r.Q)*0;
    const dd=T0K*(r.Q/Tc-r.Qh/Th)+(r.Qh-r.Q)*(1-T0K/Th)*0;
    o.rec+=dd+(r.Qh-r.Q)*(1-T0K/Th);o.rows.push({id:r.e.id,ex:dd+(r.Qh-r.Q)*(1-T0K/Th),Q:r.Q});
  });
  sim.sg.forEach(x=>{
    const eta=sim.by[x.cold].etaSteam??0.95,Qh=x.Q/eta,Th=x.L.Tsat+273.15,Tc=Tbar(x.Ti,x.Te);
    o.heat+=T0K*(x.Q/Tc-Qh/Th)+(Qh-x.Q)*(1-T0K/Th);o.steamEx+=Qh*(1-T0K/Th);
  });
  sim.cools.forEach(c=>{
    if(!(c.q>0)||c.to==='none')return;
    const cp=CP(c.s),Te=c.s.Tout+c.q/cp,Th=Tbar(Te,c.s.Tout);
    if(c.to==='tower'||c.to==='co2'){const Tc=Tbar(S.cw.Tin,S.cw.Tout);o.cool+=T0K*(c.q/Tc-c.q/Th)+c.q*(1-T0K/Tc);}
    else o.vent+=c.q*(1-T0K/Th);
  });
  o.total=o.rec+o.heat+o.cool+o.vent;
  return o;
}
LE.exergyNet=exergyNet;

/* ---------- alternativas de geometria para a mesma carga ---------- */
function geomOptions(R,exId){
  const x=R.prop.net.res.find(r=>r.e.id===exId);
  if(!x||x.Q<1||!(x.lm>0))return [];
  const hs=R.prop.by[x.e.hot],cs=R.prop.by[x.e.cold],econ=R.S.econ,LD=root.LD;
  const Thm=(x.Thi+x.Tho)/2,Tcm=(x.Tci+x.Tco)/2,need=x.Q/x.lm;
  const gP=x.e.type==='PHE'&&x.e.geom?x.e.geom:LD.G_PHE({NpH:1,NpC:1});
  const gS=x.e.type==='ST'&&x.e.geom?x.e.geom:LD.G_ST();
  const out=[];
  const add=(label,ex,F=1)=>{
    const s=sizeFor(ex,hs,cs,Thm,Tcm,need/F),r=rate({...ex,geom:s.geom},hs,cs,Thm,Tcm);
    const Vh=(hs.fluid==='steam'||hs.mTph==null)?0:((hs.mEq??hs.mTph)/3.6*(x.e.fH??1)/(r.hot.rho||1000));
    const Vc=(cs.mTph/3.6*(x.e.fC??1))/(r.cold.rho||1000);
    const kw=(Vh*(r.hot.dP||0)+Vc*(r.cold.dP||0))/econ.etaPump/1000;
    const cap=capexHX(r.A,ex.type,econ),arf=econ.i*Math.pow(1+econ.i,econ.n)/(Math.pow(1+econ.i,econ.n)-1);
    out.push({label,type:ex.type,geom:s.geom,Nt:s.Nt,short:s.short,A:r.A,U:r.U,UA:r.UA,dPh:r.hot.dP||0,dPc:r.cold.dP||0,vh:r.hot.v||0,vc:r.cold.v||0,kw,cap,tac:cap*arf+kw/1000*econ.hours*econ.pEl,F});
  };
  [30,45,50,60,65].forEach(b=>add(`Placas, β = ${b}°`,{...x.e,type:'PHE',geom:{...gP,beta:b}}));
  const F=Ffactor(x.Thi,x.Tho,x.Tci,x.Tco);
  ['cold','hot'].forEach(t=>add(`Casco e tubos, ${t==='cold'?'frio':'quente'} nos tubos`,{...x.e,type:'ST',geom:{...gS,tubeSide:t}},hs.fluid==='steam'?1:Math.max(.5,F)));
  return out;
}
LE.geomOptions=geomOptions;

/* identidade: QH,rede - QH,min = cruzamento + aquecimento abaixo + resfriamento acima + perdas nas trocas */
function identity(r){
  const losses=sum(r.prop.net.res,x=>x.Qh-x.Q);
  const c=r.pinchRules;
  return {lhs:r.prop.Qheat-c.QHcoupled,cross:c.cross,heatBelow:c.heatBelow,coolAbove:c.coolAbove,losses,rhs:c.cross+c.heatBelow+c.coolAbove+losses};
}
LE.identity=identity;

function permutations(a){return a.length<2?[a]:a.flatMap((x,i)=>permutations([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));}
/* testa todas as ordens dos trocadores em série no caldo açúcar */
function orders(S){
  const list=S.net.exchangers.filter(e=>e.cold==='C1'&&e.on!==false);
  if(list.length<2||list.length>6)return [];
  const ids=list.map(e=>e.id),out=[];
  permutations(ids).forEach(o=>{
    const ex=S.net.exchangers.map(e=>{const i=o.indexOf(e.id);return i>=0?{...e,posC:i+1}:e;});
    const r=evaluate({...S,noScan:true,net:{...S.net,exchangers:ex}}),m=r.metrics;
    out.push({order:o,dEsc:m.dEsc,QH:m.QHnet,A:m.Anew,cap:m.capHX,net:m.netH});
  });
  return out.sort((a,b)=>b.dEsc-a.dEsc);
}
LE.orders=orders;

/* varre o ΔTmin mantendo o arranjo do cenário */
function scanNet(S,a=3,b=30){
  const out=[];
  for(let d=a;d<=b;d++){
    const m=evaluate({...S,noScan:true,dTmin:d}).metrics;
    out.push({d,dEsc:m.dEsc,net:m.netH,cap:m.capHX,npv:m.npvH,pb:m.paybackH,QH:m.QHnet,QHmin:m.QHmin});
  }
  return out;
}
LE.scanNet=scanNet;

root.LE=LE;
})(typeof window!=='undefined'?window:globalThis);

function ticks(a,b,n=6){

}

      s+=`<g data-tip="${esc(st.name)}\n${lab}: ${fE(e.resQ,2)} ${eL()}\nchega a ${fmt(e.Tend,1)} °C"><circle cx="${W-RM-48}" cy="${yy}" r="12" fill="var(--surface)" stroke="var(--cold)" stroke-width="2"/><text class="m" x="${W-RM-48}" y="${yy+4}" text-anchor="middle">${lab[0].toUpperCase()}</text></g><text class="m" x="${W-RM-48}" y="${yy-16}" text-anchor="middle">${fE(e.resQ)}</text>`;
    }
    if(!hot){
      sim.sg.filter(x=>x.cold===st.id).forEach((x,i)=>{
        const cx=L+28+i*30;
        s+=`<g data-tip="${x.L.id} em ${esc(st.name)}\n${fE(x.Q,2)} ${eL()} · ${fmt(x.m,1)} t/h\n${fmt(x.Ti,1)} → ${fmt(x.Te,1)} °C"><circle cx="${cx}" cy="${yy}" r="12" fill="var(--surface)" stroke="${SRC[x.L.id]}" stroke-width="2.5"/><text class="m" x="${cx}" y="${yy+4}" text-anchor="middle" style="font-size:9.5px">${x.L.id}</text></g>`;
      });
    }
  });
  ex.forEach((x,i)=>{
    const cx=xL+(i+.5)*dx,y1=y[x.e.hot],y2=y[x.e.cold],bad=rules.rows.find(r=>r.id===x.e.id);
    const c=bad?'var(--crit)':'var(--accent)',tip=`${x.e.id} · ${x.e.name}\n${fE(x.Q,2)} ${eL()}\nquente ${fmt(x.Thi,1)} → ${fmt(x.Tho,1)} °C\nfrio ${fmt(x.Tci,1)} → ${fmt(x.Tco,1)} °C\nΔT ${fmt(x.d1,1)} e ${fmt(x.d2,1)} °C`;
    s+=`<line x1="${cx}" x2="${cx}" y1="${y1}" y2="${y2}" stroke="${c}" stroke-width="2"/>`;
    s+=hx(cx,y1,c)+hx(cx,y2,c);
    s+=`<text class="m" x="${cx+16}" y="${y1-10}">${esc(x.e.id)}</text><text class="m" x="${cx+16}" y="${y2+20}">${fE(x.Q)} ${eL()}</text>`;
    s+=`<line x1="${cx}" x2="${cx}" y1="${y1}" y2="${y2}" stroke="transparent" stroke-width="18" data-tip="${esc(tip)}"/>`;
  });
  return s+'</svg>';
}

/* ---------- geometria ---------- */
function drawPHE(g){
  const W=620,H=330,sc=Math.min(240/g.Lp,120/g.w),pw=g.w*sc,ph=g.Lp*sc,x0=58,y0=40;
  let s=`<svg class="chart-svg free" viewBox="0 0 ${W} ${H}" role="img" aria-label="Placa e pacote em escala" style="max-width:620px">`;
  s+=`<rect x="${x0}" y="${y0}" width="${pw}" height="${ph}" rx="6" fill="var(--surface2)" stroke="var(--line2)"/>`;
  const a=g.beta*Math.PI/180,tan=Math.tan(Math.PI/2-a),mid=x0+pw/2,yA=y0+g.Dp*sc+14,yB=y0+ph-g.Dp*sc-14;
  for(let y=yA;y<yB;y+=14){const dy=pw/2*Math.min(1.2,tan);s+=`<path d="M${x0+8} ${y+dy}L${mid} ${y}L${x0+pw-8} ${y+dy}" fill="none" stroke="var(--line2)" stroke-width="1"/>`;}
  const r=g.Dp*sc/2,px=[x0+r+8,x0+pw-r-8],py=[y0+r+8,y0+ph-r-8];
  px.forEach(a2=>py.forEach(b=>{s+=`<circle cx="${a2}" cy="${b}" r="${r}" fill="var(--surface)" stroke="var(--ink2)"/>`;}));
  s+=`<text class="u" x="${x0+pw/2}" y="${y0-22}" text-anchor="middle">largura ${fmt(g.w,2)} m</text><line class="axis" x1="${x0}" x2="${x0+pw}" y1="${y0-12}" y2="${y0-12}"/>`;
  s+=`<text class="u" transform="translate(${x0-26},${y0+ph/2}) rotate(-90)" text-anchor="middle">comprimento ${fmt(g.Lp,2)} m</text><line class="axis" x1="${x0-12}" x2="${x0-12}" y1="${y0}" y2="${y0+ph}"/>`;
  s+=`<text class="u" x="${x0+pw/2}" y="${y0+ph+18}" text-anchor="middle">porta ${fmt(g.Dp*1000,0)} mm · β ${g.beta}°</text>`;
  const pk=g.Nt*(g.b+g.t),pk2=Math.min(200,pk*sc),x1=x0+pw+150,fr=10;
  s+=`<rect x="${x1-fr}" y="${y0-6}" width="${fr}" height="${ph+12}" rx="2" fill="var(--ink2)"/><rect x="${x1+pk2}" y="${y0-6}" width="${fr}" height="${ph+12}" rx="2" fill="var(--ink2)"/>`;
  const n=Math.min(g.Nt,Math.floor(pk2/2.2));
  for(let i=0;i<n;i++){const x=x1+(i+.5)*pk2/n;s+=`<line x1="${x}" x2="${x}" y1="${y0}" y2="${y0+ph}" stroke="${i%2?'var(--hot)':'var(--cold)'}" stroke-width="1"/>`;}
  s+=`<text class="u" x="${x1-fr}" y="${y0-22}">pacote ${fmt(pk,2)} m${pk*sc>200?' (fora de escala)':''}</text>`;
  s+=`<text class="u" x="${x1-fr}" y="${y0+ph+18}">${g.Nt} placas · ${g.Npar} ${g.Npar>1?'quadros':'quadro'} · ${g.NpH||1}×${g.NpC||1} passes</text>`;
  return s+'</svg>';
}
function drawST(g){
  const W=640,H=300,L0=40,LW=340,sc=LW/g.L,dh=Math.min(170,g.Ds*sc),y0=70;
  let s=`<svg class="chart-svg free" viewBox="0 0 ${W} ${H}" role="img" aria-label="Casco e tubos" style="max-width:640px">`;
  s+=`<rect x="${L0}" y="${y0}" width="${LW}" height="${dh}" rx="10" fill="var(--surface2)" stroke="var(--ink2)"/>`;
  const nb=Math.max(1,Math.floor(g.L/g.B)-1),nn=Math.min(nb,60);
  for(let i=1;i<=nn;i++){const x=L0+i*LW/(nn+1),up=i%2;s+=`<line x1="${x}" x2="${x}" y1="${up?y0:y0+dh*.25}" y2="${up?y0+dh*.75:y0+dh}" stroke="var(--ink2)" stroke-width="1.5"/>`;}
  for(let i=1;i<8;i++){const y=y0+i*dh/8;s+=`<line x1="${L0+6}" x2="${L0+LW-6}" y1="${y}" y2="${y}" stroke="var(--cold)" stroke-width=".8" opacity=".6"/>`;}
  s+=`<text class="u" x="${L0+LW/2}" y="${y0-12}" text-anchor="middle">L = ${fmt(g.L,1)} m · ${nb} chicanas a cada ${fmt(g.B,2)} m</text>`;
  const cx=500,cy=y0+85,R=85,f=R/(g.Ds/2),pt=g.Pt*f,ro=g.Do*f/2;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="var(--surface2)" stroke="var(--ink2)"/>`;
  if(pt>2.2){const dyy=pt*Math.sqrt(3)/2;for(let j=-Math.ceil(R/dyy);j<=Math.ceil(R/dyy);j++)for(let i=-Math.ceil(R/pt);i<=Math.ceil(R/pt);i++){const x=(i+(j%2?0.5:0))*pt,y=j*dyy;if(Math.hypot(x,y)<R-ro-3)s+=`<circle cx="${cx+x}" cy="${cy+y}" r="${Math.max(.6,ro)}" fill="var(--cold)"/>`;}}
  s+=`<text class="u" x="${cx}" y="${y0+200}" text-anchor="middle">Ds ${fmt(g.Ds,2)} m · ${g.Nt} tubos de ${fmt(g.Do*1000,1)} mm</text>`;
  return s+'</svg>';
}
function profile(x){
  const q=x.Q*eF(),lo=Math.min(x.Tci,x.Tho),hi=Math.max(x.Thi,x.Tco);
  const svg=plot({w:560,h:260,x:[0,q||1],y:[Math.floor(lo/5)*5-5,Math.ceil(hi/5)*5+5],xf:v=>fmt(v,1),xl:`Calor trocado (${eL()})`,yl:'T (°C)',body:(sx,sy)=>{
    let s=line([[sx(0),sy(x.Tho)],[sx(q),sy(x.Thi)]],'var(--hot)',{w:2.5})+line([[sx(0),sy(x.Tci)],[sx(q),sy(x.Tco)]],'var(--cold)',{w:2.5});
    s+=dot(sx(0),sy(x.Tho),'var(--hot)',`Saída quente ${fmt(x.Tho,1)} °C`)+dot(sx(q),sy(x.Thi),'var(--hot)',`Entrada quente ${fmt(x.Thi,1)} °C`)+dot(sx(0),sy(x.Tci),'var(--cold)',`Entrada fria ${fmt(x.Tci,1)} °C`)+dot(sx(q),sy(x.Tco),'var(--cold)',`Saída fria ${fmt(x.Tco,1)} °C`);
    s+=`<text class="t" x="${sx(0)+8}" y="${(sy(x.Tho)+sy(x.Tci))/2+4}">ΔT ${fmt(x.d2,1)} °C</text><text class="t" x="${sx(q)-8}" y="${(sy(x.Thi)+sy(x.Tco))/2+4}" text-anchor="end">ΔT ${fmt(x.d1,1)} °C</text>`;
    return s;
  }});
  return fig('Perfil de temperatura','Contracorrente; a menor distância entre as linhas é a aproximação real.',svg,'',legend([['var(--hot)','Lado quente'],['var(--cold)','Lado frio']],true));
}
function sawCO2(st,ch){
  const c=st.co2,pts=[[0,c.Tin]];ch.stages.forEach((q,i)=>{pts.push([i+.8,q.T2]);pts.push([i+1,c.Tic]);});
  return plot({w:560,h:280,x:[0,ch.stages.length],y:[0,Math.ceil(ch.Tmax/20+.5)*20],xt:ch.stages.map((_,i)=>i+.5),xf:v=>`estágio ${fmt(v+.5,0)}`,yl:'T do gás (°C)',body:(sx,sy)=>{
    let s=line(pts.map(q=>[sx(q[0]),sy(q[1])]),'var(--s1)',{w:2.5});
    ch.stages.forEach((q,i)=>{s+=dot(sx(i+.8),sy(q.T2),'var(--s1)',`Estágio ${q.i}\n${fmt(q.P1,2)} → ${fmt(q.P2,2)} bar\nSai a ${fmt(q.T2,1)} °C\nPotência ${fmt(q.w,0)} kW\nCalor ao intercooler ${fmt(q.q,0)} kW`);});
    return s;
  }});
}
Object.assign(P,{eF,dE,SRC,SHORT,nm,chartComposite,chartGCC,chartCascade,chartExergy,chartTAC,chartScanNet,chartConfigs,chartBalance,chartVary,chartGeom,tornado,hx,trainSVG,gridSVG,drawPHE,drawST,profile,sawCO2});
})();
</script>
<script>
'use strict';
/* PinchSim · componentes e páginas: Visão geral, 1 Parâmetros, 2 Método pinch */
(function(){
const P=window.PS;
const {LE,LD,esc,fmt,sgn,yrs,fE,eL,fM,ic,inp,sel,chk,fld,chip,METRICS,PARAMS,metricOf,OBJ,nm}=P;
const S=()=>P.state;

const card=(title,body,o={})=>`<section class="card ${o.cls||''}" ${o.id?`id="${o.id}"`:''}>${title?`<header><div><div class="h">${o.icon?P.ic(o.icon,20):''}<h2>${title}</h2></div>${o.sub?`<p>${o.sub}</p>`:''}</div>${o.right||''}</header>`:''}${body}</section>`;
const kpi=(icon,cls,label,val,unit,em,emCls='')=>`<div class="card kpi"><div class="bub ${cls}">${ic(icon,24)}</div><div><span>${label}</span><b>${val}<small>${unit}</small></b>${em?`<em class="${emCls}">${em}</em>`:''}</div></div>`;
const STEPS=[['parametros','Parâmetros do processo e objetivos'],['metodo','Método pinch'],['rede','Configuração da rede'],['geometria','Geometria'],['resultados','Resultados']];
function stepper(cur){
  const i0=STEPS.findIndex(s=>s[0]===cur);
  return `<section class="card flat" aria-label="Etapas da simulação"><div class="stepper">${STEPS.map(([k,l],i)=>`<button data-page="${k}" class="${i<i0?'done':i===i0?'cur':''}" ${i===i0?'aria-current="step"':''}><i>${i<i0?ic('check',16):i+1}</i><span>${l}</span></button>`).join('')}</div></section>`;
}
function wnav(cur){
  const i=STEPS.findIndex(s=>s[0]===cur),prev=STEPS[i-1],next=STEPS[i+1];
  return `<div class="wnav">${prev?`<button class="btn" data-page="${prev[0]}">${ic('left',16)} Voltar</button>`:`<button class="btn" data-page="inicio">${ic('left',16)} Visão geral</button>`}${next?`<button class="btn p" data-page="${next[0]}">Próximo: ${next[1].split(' ')[0]==='Parâmetros'?'parâmetros':next[1].toLowerCase()} ${ic('right',16)}</button>`:`<button class="btn p" data-page="relatorio">Relatório final ${ic('right',16)}</button>`}</div>`;
}
const presetName=k=>k==='custom'?'Meu arranjo':(LD.presets[k]?LD.presets[k].name:k);

/* qualidade dos dados e alertas */
function quality(){
  const st=S(),c={pdf:0,der:0,hip:0,medir:0};
  st.streams.forEach(s=>{if(c[s.flag]!=null)c[s.flag]++;});
  [['pdf','Pressões das sangrias'],['pdf','Evaporação e sangrias'],['der','Caldeira e redutora'],['der','UA dos trocadores atuais'],['medir','Vinhaça no fundo da coluna A'],['medir','Geometria dos trocadores atuais'],['hip','Preços e custos'],['hip','Coluna CL-601'],['hip','Fatores de emissão']].forEach(([f])=>c[f]++);
  return c;
}
function geomChecks(x){
  const out=[];if(!x.r)return out;
  const e=x.e,g=x.auto?x.auto.geom:e.geom,R=P.R,dPm=(S().econ.dPmax||100)*1e3;
  const side=(n,s,liq)=>{
    if(!s||!s.v)return;
    if(e.type==='PHE'){
      if(s.v<.15)out.push(['warn',`${n}: ${fmt(s.v,2)} m/s no canal; abaixo de 0,15 m/s a incrustação acelera`]);
      if(s.v>1.5)out.push(['warn',`${n}: ${fmt(s.v,2)} m/s no canal, acima do usual para placas`]);
      if(s.vp>6)out.push(['warn',`${n}: ${fmt(s.vp,1)} m/s na porta; o usual é até 6 m/s`]);
    }else if(liq&&(s.v<.5||s.v>3))out.push(['warn',`${n}: ${fmt(s.v,2)} m/s; faixa usual para líquido: 0,5 a 3 m/s`]);
    if((s.dP||0)>dPm*1.001)out.push(['warn',`${n}: ${fmt(s.dP/1e3,0)} kPa de perda de carga`]);
  };
  const hs=R.prop.by[e.hot];
  side('Lado quente',x.r.hot,hs.fluid!=='gas');side('Lado frio',x.r.cold,true);
  if(e.type==='PHE'&&g.Nt>700)out.push(['warn',`${g.Nt} placas por quadro; acima de 700, use mais quadros em paralelo`]);
  if(e.type==='ST'&&x.r.bundle>g.Ds)out.push(['crit',`O feixe (${fmt(x.r.bundle,2)} m) não cabe no casco (${fmt(g.Ds,2)} m)`]);
  if(x.auto&&x.auto.short)out.push(['crit','O limite de unidades não fornece o UA pedido; aumente a área ou reduza a carga']);
  if(x.F<.75)out.push(['warn',`F = ${fmt(x.F,2)}; abaixo de 0,75 o arranjo 1-2 é pouco recomendado`]);
  return out;
}
function alerts(){
  const st=S(),R=P.R,m=R.metrics,out=[];
  const vin=P.sBy(st,'C4');
  if(vin&&vin.on){
    out.push(['warn','Confirmar se o vinho já passa por um condensador E. No PMS (p.8), os condensadores da destilaria são resfriados a água.']);
    out.push(['warn','Medir a temperatura do vinho antes e depois do trocador K e a da vinhaça no fundo da coluna A: hoje são hipóteses.']);
  }
  out.push(['warn','Confirmar o destino das 4,93 t/h de vapor flash que o PMS produz e não usa.']);
  out.push(['warn','Validar a área instalada dos trocadores: o UA atual sai do balanço, não de folha de dados.']);
  if(R.pinchRules.cross>1)out.push(['crit',`${fE(R.pinchRules.cross,2)} ${eL()} trocados através do pinch no Cenário B.`]);
  R.evRows.forEach(e=>{if(e.rate>e.rate0*1.25)out.push(['warn',`${e.n} efeito: taxa de evaporação sobe de ${fmt(e.rate0,1)} para ${fmt(e.rate,1)} kg/m²/h.`]);});
  R.exRows.forEach(x=>geomChecks(x).filter(c=>c[0]==='crit').forEach(c=>out.push(['crit',`${x.e.id}: ${c[1]}`])));
  const rf=st.refs.find(r=>r.k==='recMV');
  if(rf&&vin&&vin.on){const H3=P.sBy(st,'H3'),tot=LE.CP(H3)*Math.abs(H3.Tin-H3.Tout)/1000;if(rf.v>tot)out.push(['crit',`Seus ${fmt(rf.v,1)} MW de mosto × vinho passam do calor total do mosto no PMS (${fmt(tot,1)} MW).`]);}
  return out;
}

/* meus valores */
function decs(v){const s=String(v);const i=s.indexOf('.');return i<0?0:s.length-i-1;}
function refRows(){
  const R=P.R;
  return S().refs.map((r,i)=>{
    const Mt=METRICS[r.k];if(!Mt)return null;
    const m=metricOf(R,r.k),v=+r.v,d=m-v,tol=0.5*Math.pow(10,-decs(v))+1e-9,p=v?d/v*100:0;
    const cls=Math.abs(d)<=tol?'ok':Math.abs(p)<=5?'warn':'crit';
    return {i,k:r.k,Mt,m,v,d,p,cls};
  }).filter(Boolean);
}
function goalBox(){
  const st=S(),g=st.ui.goal,G=P.goal,Mt=METRICS[g.metric];
  const ref=st.refs.find(r=>r.k===g.metric);
  let out='';
  if(G){
    const Q=PARAMS[G.param],M2=METRICS[G.metric];
    out=G.found?`<div class="info ok">${ic('check',18)}<div>${esc(Q.l)} = <b class="mono">${fmt(G.x,Q.lo<1?3:2)} ${Q.u}</b> leva ${esc(M2.l.toLowerCase())} a <b class="mono">${fmt(G.y,M2.d)} ${M2.u}</b>. Valor atual do parâmetro: ${fmt(Q.g(st),Q.lo<1?3:2)} ${Q.u}.<div class="row" style="margin-top:8px"><button class="btn p s" data-act="goal-apply">Aplicar ao modelo</button></div></div></div>`
      :`<div class="info warn">${ic('alert',18)}<div>${esc(Q.l)} não alcança ${fmt(G.target,M2.d)} ${M2.u} na faixa de ${fmt(Q.lo,2)} a ${fmt(Q.hi,2)} ${Q.u}: o resultado vai de ${fmt(G.min,2)} a ${fmt(G.max,2)} ${M2.u}. Teste outro parâmetro ou revise a configuração.</div></div>`;
  }
  return `<div class="stack"><h3>Chegar no meu valor</h3><p class="note">Escolha a grandeza e o parâmetro incerto. A busca refaz a simulação até o modelo bater com o seu número.</p>
   <div class="fg" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
    ${fld('Grandeza',sel('ui.goal.metric',g.metric,Object.entries(METRICS).map(([k,v])=>[k,`${v.l} (${v.u})`]),{label:'Grandeza'}))}
    ${fld('Valor-alvo',inp('ui.goal.target',g.target??(ref?ref.v:null),{cls:'w',ph:Mt.u,label:'Valor-alvo'}))}
    ${fld('Parâmetro a ajustar',sel('ui.goal.param',g.param,Object.entries(PARAMS).map(([k,v])=>[k,`${v.l}${v.u?' ('+v.u+')':''}`]),{label:'Parâmetro'}))}
   </div><div><button class="btn p" data-act="goal">${ic('target',16)} Buscar</button></div>${out}</div>`;
}
function refsCard(withGoal=true){
  const rows=refRows(),R=P.R,m=R.metrics;
  const tr=rows.map(r=>`<tr><td><b>${esc(r.Mt.l)}</b></td><td class="r">${P.inp('refs.'+r.i+'.v',r.v,{cls:'s',label:'Seu valor'})}</td><td class="r m">${fmt(r.m,r.Mt.d)}</td><td>${r.Mt.u}</td><td class="r">${chip((r.d>=0?'+':'−')+fmt(Math.abs(r.p),1)+'%',r.cls)}</td><td style="white-space:nowrap"><button class="btn s" data-act="goal-pick" data-k="${r.k}">Ajustar</button><button class="btn x" data-act="ref-del" data-i="${r.i}" aria-label="Remover">×</button></td></tr>`).join('');
  const has=k=>S().refs.some(r=>r.k===k);
  const exp=[];
  if(has('metaBal')||has('QHminA'))exp.push(`<b>Calor mínimo.</b> ${fmt(m.metaBal,1)} MW vem do balanço: QH atual − (QC atual − QC mín) = ${fmt(m.QHbase,2)} − ${fmt(m.pot,2)}. A tabela problema dá ${fmt(m.QHminA,2)} MW. A diferença de ${fmt(m.metaBal-m.QHminA,2)} MW é o vapor flash sem destino e o CDVG que segue quente (${fmt((R.base.Qvent+R.base.Qcarry)/1000,2)} MW) mais as perdas de 5% nos aquecedores (${fmt(R.idBase.losses/1000,2)} MW), que o balanço simples não enxerga.`);
  if(has('QHbase'))exp.push(`<b>Calor externo atual.</b> Inclui ${fmt(R.base.sg.filter(x=>x.cold==='C4').reduce((a,x)=>a+x.Q,0)/1000,2)} MW de vapor da coluna para levar o vinho de ${fmt(P.sBy(S(),'C4').Tin,0)} °C à alimentação. Os ${fmt(P.sBy(S(),'C4').Tout,0)} °C são hipótese; a busca acerta esse número.`);
  if(has('recMV')){const H3=P.sBy(S(),'H3');exp.push(`<b>Mosto × vinho.</b> O mosto do PMS (${fmt(H3.mTph,1)} t/h, ${fmt(H3.Tin,2)} → ${fmt(H3.Tout,0)} °C) tem ${fmt(LE.CP(H3)*Math.abs(H3.Tin-H3.Tout)/1000,2)} MW no total. Com ΔTmín de ${fmt(S().dTmin,0)} °C, o vinho a ${fmt(P.sBy(S(),'C4').Tin,0)} °C limita a troca a ${fmt(m.recMV,2)} MW.`);}
  return card('Meus valores × modelo',`<div class="grid ${withGoal?'g21':''}"><div class="stack"><div class="scroll"><table><thead><tr><th>Grandeza</th><th class="r">Seu valor</th><th class="r">Modelo</th><th>Unid.</th><th class="r">Desvio</th><th></th></tr></thead><tbody>${tr||'<tr><td colspan="6" class="note">Nenhum valor de referência. Adicione abaixo.</td></tr>'}</tbody></table></div>
   <div class="row">${sel('ui.newRef',S().ui.newRef||'QHminA',Object.entries(METRICS).filter(([k])=>!has(k)).map(([k,v])=>[k,v.l]),{label:'Nova grandeza'})}<button class="btn s" data-act="ref-add">Adicionar</button></div>
