  </div>
  <div class="grid g2">
   ${card('Prova: quatro caminhos, o mesmo alvo',`<div class="scroll"><table><thead><tr><th>Caminho</th><th class="r">QH mín (kW)</th><th class="r">QC mín (kW)</th></tr></thead><tbody>
    ${eqv.map((r,i)=>`<tr><td>${r[0]}</td><td class="r m">${fmt(r[1],2)}</td><td class="r m">${i===3?'—':fmt(r[2],2)}</td></tr>`).join('')}
    <tr><td>Balanço: QH − QC = Σ frias − Σ quentes</td><td class="r m" colspan="2">${fmt(p.QH-p.QC,2)} = ${fmt(sumC-sumH,2)}</td></tr></tbody>
    <tfoot><tr><td colspan="3">${maxd<1?chip('Os quatro caminhos coincidem (diferença < 1 kW)','ok'):chip('Diferença de '+fmt(maxd,1)+' kW','warn')}</td></tr></tfoot></table></div>
    <p class="note" style="margin-top:8px">A verificação gráfica não usa a cascata: desloca a composta fria por bisseção até a menor distância vertical fechar em ΔTmín. Pinch em T* = ${fmt(p.pinch,2)} °C (${fmt(p.pinchHot,2)} °C quente, ${fmt(p.pinchCold,2)} °C frio).</p>`,{icon:'check',sub:'O alvo não depende do método escolhido para vê-lo.'})}
   ${card('Seu calor mínimo × alvo do método',`<div class="eq">QH atual (Cenário A)          = ${fmt(m.QHbase,2)} MW
QC atual                      = ${fmt(m.QCbase,2)} MW
QC mín (tabela problema)      = ${fmt(m.QCminA,2)} MW
Potencial = QC atual − QC mín = ${fmt(m.pot,2)} MW
Meta por balanço = QH atual − potencial = ${fmt(m.metaBal,2)} MW
QH mín (tabela problema)      = ${fmt(m.QHminA,2)} MW
Diferença                     = ${fmt(m.metaBal-m.QHminA,2)} MW
  = flash sem destino + CDVG quente ${fmt(vc/1000,2)} MW
  + perdas de 5% nos aquecedores  ${fmt(ib.losses/1000,2)} MW</div>
   <p class="note" style="margin-top:8px">O balanço QH − QC = constante só vale quando todo calor rejeitado passa pela torre e não há perdas. Na Lins, parte do calor sai como flash sem uso e CDVG quente, e os aquecedores perdem 5%. Por isso o alvo correto é o da tabela problema; o “64,0 MW” corresponde à meta por balanço.</p>`,{icon:'target',sub:'Reconciliação do número da sua imagem com o alvo rigoroso.'})}
  </div>
  <div class="grid g2">${card('',P.chartTAC(R)+`<p class="note" style="margin-top:6px">Alvo de área ${fmt(R.b.A,0)} m² com ${R.units.N} unidades em ΔTmín ${fmt(st.dTmin,1)} °C.</p>`)}${card('',P.chartScanNet(sc)+'<p class="note" style="margin-top:6px">Acima de ~20 °C os aquecedores pedem vapor mais nobre e o ganho some. O ótimo de VPL e o de payback ficam em pontos diferentes: a escolha do ΔTmín depende do objetivo.</p>')}</div>
  ${card('Tabela problema',`<div class="scroll"><table><thead><tr><th>#</th><th class="r">T* sup. °C</th><th class="r">T* inf. °C</th><th>Correntes</th><th class="r">ΣCPf − ΣCPq kW/K</th><th class="r">ΔH kW</th><th class="r">1ª passagem kW</th><th class="r">Cascata viável kW</th></tr></thead><tbody>${ptaRows}</tbody></table></div>`,{sub:'ΔH = (ΣCP frio − ΣCP quente)·ΔT*. A linha destacada termina no pinch.'})}
  ${card('Por que a rede fica acima do alvo',`<div class="grid g2"><div class="scroll"><table><thead><tr><th></th><th class="r">Cenário A</th><th class="r">Cenário B</th></tr></thead><tbody>
   <tr><td>Vapor da rede − QH mín</td><td class="r m">${fmt(ib.lhs,0)}</td><td class="r m">${fmt(id.lhs,0)}</td></tr>
   <tr><td>Troca cruzando o pinch</td><td class="r m">${fmt(ib.cross,0)}</td><td class="r m">${fmt(id.cross,0)}</td></tr>
   <tr><td>Vapor abaixo do pinch</td><td class="r m">${fmt(ib.heatBelow,0)}</td><td class="r m">${fmt(id.heatBelow,0)}</td></tr>
   <tr><td>Resfriamento acima do pinch</td><td class="r m">${fmt(ib.coolAbove,0)}</td><td class="r m">${fmt(id.coolAbove,0)}</td></tr>
   <tr><td>Perdas nas trocas (η)</td><td class="r m">${fmt(ib.losses,0)}</td><td class="r m">${fmt(id.losses,0)}</td></tr></tbody>
   <tfoot><tr><td>Soma (kW)</td><td class="r m">${fmt(ib.rhs,0)} ${eq(ib.lhs,ib.rhs)?chip('fecha','ok'):chip('não fecha','crit')}</td><td class="r m">${fmt(id.rhs,0)} ${eq(id.lhs,id.rhs)?chip('fecha','ok'):chip('não fecha','crit')}</td></tr></tfoot></table></div>
   <p class="note">Toda a distância entre o vapor de uma rede e o QH mínimo se explica pelas três regras do pinch (não cruzar, não aquecer abaixo, não resfriar acima) mais as perdas. A soma fecha com a primeira linha, o que prova que nenhum termo ficou de fora.</p></div>`,{icon:'scale'})}
  ${wnav('metodo')}`;
}
Object.assign(P,{card,kpi,stepper,wnav,presetName,quality,geomChecks,alerts,refsCard,goalBox,pageInicio,pageParametros,pageMetodo,METHODS});
})();
</script>
<script>
'use strict';
/* PinchSim · páginas 3 Configuração, 4 Geometria, 5 Resultados */
(function(){
const P=window.PS;
const {LE,LD,esc,fmt,sgn,yrs,fE,eL,fM,cL,ic,inp,sel,chk,fld,chip,METRICS,OBJ,nm,card,kpi,stepper,wnav,presetName,geomChecks}=P;
const S=()=>P.state;

function configRows(){
  const st=S(),rows=LD.order.map(k=>{const r=k===st.preset?P.R:P.evalQuiet(P.presetState(st,k));return {k,name:LD.presets[k].name,desc:LD.presets[k].desc,m:r.metrics,r};});
  if(st.preset==='custom')rows.push({k:'custom',name:'Meu arranjo',desc:'Configuração editada à mão.',m:P.R.metrics,r:P.R});
  const [,f,dir]=OBJ[st.obj];
  const cand=rows.filter(r=>r.k!=='atual'&&Number.isFinite(f(r.r))&&r.m.netH>0);
  cand.sort((a,b)=>dir*(f(a.r)-f(b.r)));
  if(cand[0])cand[0].best=true;
  rows.forEach(r=>{r.rank=cand.indexOf(r)+1;});
  return rows;
}
function statusOf(x){
  const st=S(),c=[],dT=x.dTmin;
  if(x.Q<1)c.push(chip('sem troca','info'));
  else if(dT<=0)c.push(chip('cruzamento de T','crit'));
  else if(dT<st.dTmin-.05)c.push(chip('ΔT '+fmt(dT,1)+' °C','warn'));
  if(x.limited&&x.Q>1)c.push(chip(x.limited==='alvo quente'&&x.e.hot==='H5'?'flash esgotado':x.limited,'info'));
  return c.join(' ')||chip('ok','ok');
}
function whoSVG(R){
  const seg=(sim,cid)=>{const s=[];sim.net.res.filter(x=>x.e.cold===cid&&x.Q>1).sort((a,b)=>a.e.posC-b.e.posC).forEach(x=>s.push({k:x.e.hot,Q:x.Q,l:x.e.id,Ti:x.Tci,Te:x.Tco}));sim.sg.filter(x=>x.cold===cid).forEach(x=>s.push({k:x.L.id,Q:x.Q,l:x.L.id,Ti:x.Ti,Te:x.Te}));return s;};
  const rows=R.prop.streams.filter(s=>s.kind==='cold'&&s.on).map(s=>({id:s.id,n:nm(s.id),a:seg(R.base,s.id),b:seg(R.prop,s.id)}));
  const W=1000,L=170,rW=20,max=Math.max(...rows.flatMap(q=>[q.a,q.b].map(a=>a.reduce((s,x)=>s+x.Q,0))),1),sx=v=>(W-L-80)*v/max;
  let y=6,s='';const used=new Set();
  rows.forEach(q=>{[[q.a,'Cenário A'],[q.b,'Cenário B']].forEach(([a,lab],i)=>{
    s+=`<text class="${i?'t':'u'}" x="4" y="${y+14}">${esc(q.n)}, ${lab}</text>`;let x=L;
    a.forEach(g=>{used.add(g.k);const w=Math.max(1,sx(g.Q)-2);s+=`<rect x="${x}" y="${y}" width="${w}" height="${rW}" rx="3" fill="${P.SRC[g.k]||'var(--s6)'}" data-tip="${esc(nm(g.k))} (${esc(g.l)})\n${fE(g.Q,2)} ${eL()}\n${fmt(g.Ti,1)} → ${fmt(g.Te,1)} °C"/>`;x+=sx(g.Q);});
    const vap=a.filter(g=>/^V/.test(g.k)).reduce((t,g)=>t+g.Q,0);
    s+=`<text class="m" x="${x+6}" y="${y+14}">vapor ${fE(vap)}</text>`;y+=rW+4;});y+=10;});
  const leg=['H3','H1','H2','H5','H4','H6','VV3','VV2','VV1','VE'].filter(k=>used.has(k)).map(k=>[P.SRC[k],nm(k)]);
  return P.fig('Quem aquece cada corrente fria',`Barras em ${eL()}, da entrada até o alvo. À direita, o vapor usado na linha.`,`<svg class="chart-svg" viewBox="0 0 ${W} ${y}" role="img" style="min-width:720px">${s}</svg>`,P.legend(leg));
}
function pageRede(){
  const st=S(),R=P.R,net=st.net,rows=configRows(),view=st.ui.netView,sim=view==='A'?R.base:R.prop;
  const objName=OBJ[st.obj][0].toLowerCase();
  const mt=r=>`<span class="mt"><span>vapor ${fE(r.m.QHnet*1000)} ${eL()}</span><span>escape −${fmt(r.m.dEsc,1)} t/h</span><span>${r.k==='atual'?'referência':'payback '+yrs(r.m.paybackH)}</span></span>`;
  const opts=rows.map(r=>`<button class="opt" role="radio" aria-checked="${st.preset===r.k}" data-act="preset" data-k="${r.k}"><span class="rd"></span><div><b>${esc(r.name)} ${r.best?chip('melhor: '+objName,'ok'):''}</b><p>${esc(r.desc)}</p>${mt(r)}</div></button>`).join('');
  const rk=[...rows].filter(r=>r.k!=='atual').sort((a,b)=>(a.rank||99)-(b.rank||99));
  const hotOpts=R.prop.streams.filter(s=>s.kind==='hot').map(s=>[s.id,`${s.id} ${nm(s.id)}`]),coldOpts=R.prop.streams.filter(s=>s.kind==='cold').map(s=>[s.id,`${s.id} ${nm(s.id)}`]);
  const specs=[['dT','ΔT alvo'],['geom','Geometria'],['UA','UA fixo'],['Q','Carga fixa'],['Tho','T saída quente']];
  const exT=net.exchangers.map((e,i)=>{
    const x=R.prop.net.res.find(r=>r.e.id===e.id),p=`net.exchangers.${i}.`;
    const par=e.spec==='dT'?inp(p+'dT',e.dT,{cls:'xs',ph:fmt(st.dTmin,1),label:'ΔT alvo'}):e.spec==='UA'?inp(p+'UA',e.UA,{cls:'xs',label:'UA'}):e.spec==='Q'?inp(p+'Q',e.Q,{cls:'s',label:'Carga'}):e.spec==='Tho'?inp(p+'Tho',e.Tho,{cls:'xs',label:'T saída quente'}):`<span class="note">etapa 4</span>`;
    return `<tr><td>${chk(p+'on',e.on!==false,'Ativar '+e.id)}</td><td><span class="tag">${esc(e.id)}</span></td>
    <td>${sel(p+'hot',e.hot,hotOpts,{label:'Quente',style:'width:128px'})}</td><td>${sel(p+'cold',e.cold,coldOpts,{label:'Frio',style:'width:128px'})}</td>
    <td>${inp(p+'posH',e.posH,{cls:'xs',label:'Ordem quente',step:1})}</td><td>${inp(p+'posC',e.posC,{cls:'xs',label:'Ordem fria',step:1})}</td><td>${inp(p+'fC',e.fC??1,{cls:'xs',label:'Fração fria'})}</td>
    <td>${sel(p+'spec',e.spec,specs,{label:'Modo',style:'width:118px'})}</td><td>${par}</td><td>${inp(p+'eta',e.eta??1,{cls:'xs',label:'η'})}</td>
    ${x?`<td class="r m">${fE(x.Q,2)}</td><td class="r m">${fmt(x.Thi,1)}→${fmt(x.Tho,1)}</td><td class="r m">${fmt(x.Tci,1)}→${fmt(x.Tco,1)}</td><td class="r m">${fmt(x.lm,1)}</td><td class="r m">${fmt(x.UA,0)}</td><td>${statusOf(x)}</td>`:`<td colspan="6" class="note">inativo (corrente desligada)</td>`}
    <td><button class="btn x" data-act="ex-del" data-i="${i}" aria-label="Remover ${esc(e.id)}">×</button></td></tr>`;
  }).join('');
  const ord=P.ordersRes;let ordH='';
  if(ord&&ord.length){const mx=Math.max(...ord.map(o=>o.dEsc),1);ordH=`<div class="bars" style="margin-top:12px">${ord.slice(0,10).map((o,i)=>`<div class="bar"><span class="mono" style="font-size:12px">${o.order.join(' › ')}</span><div class="tr"><i style="width:${Math.max(0,o.dEsc/mx*100)}%;background:${i?'var(--line2)':'var(--accent)'}"></i></div><span class="v">${fmt(o.dEsc,1)} t/h</span></div>`).join('')}</div><p class="note" style="margin-top:6px">${ord.length} ordens testadas com a simulação completa; pior ordem: ${fmt(ord[ord.length-1].dEsc,1)} t/h.</p>`;}
  const diag=card('Diagrama da rede',`<div class="scroll">${P.gridSVG(R,sim)}</div><div class="legend"><span><i class="l" style="background:var(--hot)"></i>Corrente quente</span><span><i class="l" style="background:var(--cold)"></i>Corrente fria</span><span><i style="background:var(--accent)"></i>Troca</span><span><i style="background:var(--crit)"></i>Troca cruzando o pinch</span><span>T = torre · S = sobra · L = livre</span></div>`,{icon:'network',sub:'Quente em cima, frio embaixo; círculos à esquerda são vapor. Passe o cursor para ver temperaturas.',right:`<div class="seg g" role="group" aria-label="Cenário"><button aria-pressed="${view==='A'}" data-act="view" data-k="A">Cenário A</button><button aria-pressed="${view==='B'}" data-act="view" data-k="B">Cenário B</button></div>`});
  const proof=card('Prova da configuração',`<div class="stack"><div class="scroll">${P.chartConfigs(rows,st.preset,st.obj)}</div><div class="scroll"><table><thead><tr><th>#</th><th>Configuração</th><th class="r">Escape t/h</th><th class="r">CAPEX</th><th class="r">Payback</th><th class="r">VPL</th></tr></thead><tbody>${rk.map(r=>`<tr class="${r.k===st.preset?'hl':''}"><td class="m">${r.rank||'—'}</td><td><b>${esc(r.name)}</b></td><td class="r m">${fmt(r.m.dEsc,1)}</td><td class="r m">${fmt(r.m.capHX/1e6,2)}</td><td class="r m">${Number.isFinite(r.m.paybackH)?fmt(r.m.paybackH,2):'—'}</td><td class="r m">${fmt(r.m.npvH/1e6,1)}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">Mesmos parâmetros e mesmo ΔTmín para todas. Linha laranja: vapor de hoje; verde: QH mínimo da tabela problema, que nenhuma rede ultrapassa. Menos MW de vapor não é tudo: “Só realocar sangrias” usa mais vapor, mas de sangrias mais fracas, e ainda reduz o escape (Rillieux). Troque o objetivo na etapa 1 e o ranking muda.</p></div>`,{icon:'check',sub:`Ordenadas por ${objName}. CAPEX e VPL em R$ milhões.`});
  return `${stepper('rede')}
  <div class="grid g12">
   ${card('Escolha a configuração',`<div class="opts" role="radiogroup" aria-label="Configuração">${opts}</div>`,{icon:'network',sub:`O selo “melhor” segue o objetivo da etapa 1: ${objName}.`})}
   ${proof}
  </div>
  ${diag}
  ${card('Trocadores',`<div class="scroll"><table><thead><tr><th></th><th>Tag</th><th>Quente</th><th>Frio</th><th>Ordem q.</th><th>Ordem f.</th><th>Fração f.</th><th>Modo</th><th>Valor</th><th class="nt">η</th><th class="r">Q ${eL()}</th><th class="r">T quente</th><th class="r">T frio</th><th class="r">LMTD</th><th class="r">UA kW/K</th><th>Situação</th><th></th></tr></thead><tbody>${exT}</tbody></table></div>
   <div class="row" style="margin-top:10px"><button class="btn s" data-act="ex-add">Adicionar trocador</button><span class="note">Mesma ordem fria com frações &lt; 1 = ramos em paralelo. Editar aqui transforma o cenário em “Meu arranjo”.</span></div>`,{icon:'sliders'})}
  ${card('',whoSVG(R))}
  <div class="grid g2">
   ${card('Aquecimento final com vapor',`<div class="row" style="margin-bottom:10px">${fld('Regra das sangrias',sel('net.ladder',net.ladder,[['pdf','Cortes do PMS (81/91/105 °C)'],['opt','Menor nível viável']],{label:'Regra'}))}${fld('Aproximação nos aquecedores (°C)',inp('net.dTap',net.dTap,{ph:'= ΔTmín',label:'Aproximação'}))}</div>
    <div class="scroll"><table><thead><tr><th>Corrente</th><th>Nível</th><th class="r">T entra</th><th class="r">T sai</th><th class="r">Q ${eL()}</th><th class="r">Vapor t/h</th><th class="r">Peso no escape</th></tr></thead><tbody>
    ${R.prop.sg.map(x=>`<tr><td><span class="tag">${x.cold}</span></td><td>${x.L.id}${x.cold==='C4'?' (coluna)':''}</td><td class="r m">${fmt(x.Ti,1)}</td><td class="r m">${fmt(x.Te,1)}</td><td class="r m">${fE(x.Q,2)}</td><td class="r m">${fmt(x.m,2)}</td><td class="r m">${fmt(x.L.w,1)}</td></tr>`).join('')}</tbody></table></div>`,{icon:'flame',sub:'O que a recuperação não alcança sai das sangrias. Pelo princípio de Rillieux, VV3 pesa 2/5 no escape, VV2 3/5 e VV1 4/5.'})}
   ${card('Qual ordem é a melhor?',`<button class="btn p" data-act="orders">Testar todas as ordens</button>${ordH}`,{icon:'layers',sub:'Testa todas as sequências dos trocadores do caldo açúcar e ordena pelo escape economizado.'})}
  </div>
  ${wnav('rede')}`;
}

/* ---------- 4 · Geometria ---------- */
function pageGeometria(){
  const st=S(),R=P.R,rows=R.exRows.filter(x=>x.Q>1);
  if(!rows.length)return `${stepper('geometria')}${card('Geometria','<p class="note">Não há trocadores ativos neste cenário.</p>')}${wnav('geometria')}`;
  const x=rows.find(r=>r.e.id===st.ui.sel)||rows.find(r=>r.r&&r.e.isNew)||rows[0],e=x.e;
  const i=st.net.exchangers.findIndex(q=>q.id===e.id),p=`net.exchangers.${i}.`,raw=st.net.exchangers[i];
  const pick=`<div class="tabsx">${rows.map(r=>`<button aria-pressed="${r.e.id===e.id}" data-act="sel" data-k="${esc(r.e.id)}">${esc(r.e.id)}${r.e.isNew?' · novo':''}</button>`).join('')}</div>`;
  if(!raw.geom){
    return `${stepper('geometria')}${card('Trocadores da rede',pick,{icon:'cube'})}
    ${card(`${esc(e.id)} · ${esc(e.name)}`,`<p class="lead">Este trocador já existe e o PMS não traz sua geometria. O modelo usa o UA que fecha o balanço atual e cobra só a área adicional.</p>
    <dl class="kv" style="max-width:460px;margin-top:12px"><dt>Carga</dt><dd>${fE(x.Q,2)} ${eL()}</dd><dt>LMTD</dt><dd>${fmt(x.lm,1)} °C</dd><dt>UA necessário</dt><dd>${fmt(x.UA,0)} kW/K</dd><dt>Área equivalente</dt><dd>${fmt(x.Atot,0)} m²</dd><dt>Área adicional</dt><dd>${fmt(x.Aadd,0)} m²</dd><dt>Custo adicional</dt><dd>${fM(x.cost)}</dd></dl>
    <div class="row" style="margin-top:12px"><button class="btn p" data-act="geom-add" data-t="PHE">Detalhar como placas</button><button class="btn" data-act="geom-add" data-t="ST">Detalhar como casco e tubos</button></div>`)}
    ${wnav('geometria')}`;
  }
  const g=x.auto?x.auto.geom:raw.geom,gp=p+'geom.',auto=raw.spec==='dT',r=x.r;
  const form=e.type==='PHE'?`<div class="fg">
   ${fld('Nº de placas',inp(gp+'Nt',g.Nt,{dis:auto,step:2,label:'Placas'}),auto?'calculado pelo ΔT alvo':'')}
   ${fld('Largura (m)',inp(gp+'w',raw.geom.w,{label:'Largura'}))}${fld('Comprimento útil (m)',inp(gp+'Lp',raw.geom.Lp,{label:'Comprimento'}))}
   ${fld('Canal (mm)',inp(gp+'b',raw.geom.b,{scale:1000,label:'Canal'}))}${fld('Espessura (mm)',inp(gp+'t',raw.geom.t,{scale:1000,label:'Espessura'}))}
   ${fld('k da placa (W/mK)',inp(gp+'kp',raw.geom.kp,{label:'k'}))}${fld('Fator de área φ',inp(gp+'phi',raw.geom.phi,{label:'φ'}))}
   ${fld('Ângulo de chevron β',sel(gp+'beta',raw.geom.beta,[[30,'30°'],[45,'45°'],[50,'50°'],[60,'60°'],[65,'65°']],{num:1,label:'β'}))}
   ${fld('Passes quente',inp(gp+'NpH',raw.geom.NpH,{step:1,label:'Passes quente'}))}${fld('Passes frio',inp(gp+'NpC',raw.geom.NpC,{step:1,label:'Passes frio'}))}
   ${fld('Quadros em paralelo',inp(gp+'Npar',raw.geom.Npar,{step:1,label:'Quadros'}))}${fld('Porta (m)',inp(gp+'Dp',raw.geom.Dp,{label:'Porta'}))}</div>`
  :`<div class="fg">
   ${fld('Nº de tubos',inp(gp+'Nt',g.Nt,{dis:auto,step:1,label:'Tubos'}),auto?'calculado pelo ΔT alvo':'')}
   ${fld('Dext (mm)',inp(gp+'Do',raw.geom.Do,{scale:1000,label:'Dext'}))}${fld('Dint (mm)',inp(gp+'Di',raw.geom.Di,{scale:1000,label:'Dint'}))}
   ${fld('Comprimento (m)',inp(gp+'L',raw.geom.L,{label:'Comprimento'}))}${fld('Passes nos tubos',inp(gp+'Np',raw.geom.Np,{step:1,label:'Passes'}))}
   ${fld('Passo (mm)',inp(gp+'Pt',raw.geom.Pt,{scale:1000,label:'Passo'}))}${fld('Casco (m)',inp(gp+'Ds',g.Ds,{dis:auto,label:'Casco'}),auto?'ajustado ao feixe':'')}
   ${fld('Chicanas (m)',inp(gp+'B',raw.geom.B,{label:'Chicanas'}))}${fld('k do tubo (W/mK)',inp(gp+'kw',raw.geom.kw,{label:'k'}))}
   ${fld('Fluido nos tubos',sel(gp+'tubeSide',raw.geom.tubeSide,[['cold','Frio'],['hot','Quente']],{label:'Tubos'}))}${fld('Unidades em paralelo',inp(gp+'Npar',raw.geom.Npar,{step:1,label:'Unidades'}))}</div>`;
  const hs=R.prop.by[e.hot],cs=R.prop.by[e.cold];
  const mf=(s,f)=>s.mTph==null||s.fluid==='steam'?'—':fmt((s.mEq??s.mTph)/3.6*f,1);
  const cmp=(a,b,dd=1,sc=1)=>`<td class="r m">${a!=null&&a!==0?fmt(a*sc,dd):'—'}</td><td class="r m">${b!=null&&b!==0?fmt(b*sc,dd):'—'}</td>`;
  const chks=geomChecks(x),hH=r?r.hot:{},hC=r?r.cold:{};
  const opts=LE.geomOptions(R,e.id);
  let ci=opts.findIndex(o=>o.type===e.type&&(e.type==='PHE'?o.geom.beta===g.beta:o.geom.tubeSide===g.tubeSide));
  const okO=opts.filter(o=>!o.short),best=okO.length?okO.reduce((a,b)=>b.tac<a.tac?b:a):null,bi=opts.indexOf(best);
  const memo=r?(e.type==='PHE'?`De = 2·b/φ = 2·${fmt(g.b*1000,1)}/${fmt(g.phi,2)} = ${fmt(hC.De*1000,2)} mm
Gc = ṁ/(Nquadros·Ncanais·b·w) = ${fmt(hC.G,0)} kg/m²s (frio)
Re = Gc·De/μ = ${fmt(hC.Re,0)}   Pr = cp·μ/k = ${fmt(hC.Pr,2)}
Nu = ${hC.Ch}·Re^${hC.y}·Pr^(1/3) = ${fmt(hC.Nu,1)}   (Kumar, β = ${g.beta}°)
h = Nu·k/De = ${fmt(hC.h,0)} W/m²K (frio)   ${fmt(hH.h,0)} W/m²K (quente)
1/U = 1/hq + 1/hf + t/k + fPHE·(Rfq + Rff)
U = ${fmt(r.U,0)} W/m²K   A = Nquadros·(Nt−2)·φ·w·L = ${fmt(r.A,1)} m²
UA = F·U·A = ${fmt(r.UA,1)} kW/K   NTU = UA/Cmín = ${fmt(x.NTU,3)}   ε = ${fmt(x.eps,3)}
Q = η·ε·Cmín·(Tqe − Tfe) = ${fmt(x.Q,0)} kW`:`Tubos: Re = ${fmt(r.tube.Re,0)}, Nu = ${fmt(r.tube.Nu,1)}, h = ${fmt(r.tube.h,0)} W/m²K (${r.tube.corr||'—'})
${r.shell.Re?`Casco: Re = ${fmt(r.shell.Re,0)}, Nu = 0,36·Re^0,55·Pr^(1/3) = ${fmt(r.shell.Nu,1)}, h = ${fmt(r.shell.h,0)} W/m²K (Kern)`:`Casco: condensação, h = ${fmt(r.shell.h,0)} W/m²K (fixo)`}
1/U = Do/(Di·hi) + Do·Rfi/Di + Do·ln(Do/Di)/(2k) + Rfo + 1/ho
U = ${fmt(r.U,0)} W/m²K   A = π·Do·L·Nt = ${fmt(r.A,1)} m²   F = ${fmt(x.F,3)}
UA = ${fmt(r.UA,1)} kW/K   NTU = ${fmt(x.NTU,3)}   ε = ${fmt(x.eps,3)}
Q = ${fmt(x.Q,0)} kW`):'';
  const oT=opts.map((o,k)=>`<tr class="${k===ci?'hl':''}"><td><b>${esc(o.label)}</b>${k===bi?' '+chip('menor custo','ok'):''}</td><td class="r m">${o.short?'—':o.Nt}</td><td class="r m">${fmt(o.A,0)}</td><td class="r m">${fmt(o.U,0)}</td><td class="r m">${fmt(o.dPh/1e3,0)} / ${fmt(o.dPc/1e3,0)}</td><td class="r m">${fmt(o.cap/1e6,2)}</td><td class="r m">${o.short?'—':fmt(o.tac/1e6,3)}</td><td>${o.short?chip('não atende','crit'):k===ci?chip('em uso','info'):`<button class="btn s" data-act="geom-use" data-i="${k}">Usar</button>`}</td></tr>`).join('');
  return `${stepper('geometria')}
  ${card('Trocadores da rede',pick,{icon:'cube',sub:'Escolha o trocador. Os novos são dimensionados; os existentes usam o UA do balanço.'})}
  <div class="grid g2">
   ${card(`${esc(e.id)} · ${esc(e.name)}`,`<div class="stack"><div class="row">${fld('Tipo',sel(p+'type',e.type,[['PHE','Placas'],['ST','Casco e tubos']],{label:'Tipo'}))}${fld('Modo',sel(p+'spec',e.spec,[['dT','ΔT alvo (dimensiona)'],['geom','Geometria fixa (rating)']],{label:'Modo'}))}${auto?`<button class="btn s" data-act="geom-fix" style="align-self:end">Fixar esta geometria</button>`:''}</div>${form}
    ${chks.length?`<div class="row">${chks.map(c=>chip(esc(c[1]),c[0])).join(' ')}</div>`:(r?`<div>${chip('Velocidades e perda de carga dentro das faixas usuais','ok')}</div>`:'')}
    ${e.type==='PHE'?P.fig('Desenho em escala','Placa e pacote na mesma escala; azul e laranja alternam os canais frio e quente.',P.drawPHE(g)):P.fig('Desenho em escala','Corte longitudinal e seção do feixe.',P.drawST(g))}</div>`,{icon:'cube',sub:auto?'Em ΔT alvo, o programa ajusta o nº de placas ou tubos para a carga, com perda de carga até o limite das Configurações.':'Em geometria fixa, a carga vira resultado (ε-NTU) e muda o valor final.'})}
   ${card('',`<div class="stack">${P.profile(x)}${r?`<div class="scroll"><table><thead><tr><th></th><th class="r">Quente</th><th class="r">Frio</th></tr></thead><tbody>
    <tr><td>Vazão no trocador (kg/s)</td><td class="r m">${mf(hs,e.fH??1)}</td><td class="r m">${mf(cs,e.fC??1)}</td></tr>
    <tr><td>Velocidade (m/s)</td>${cmp(hH.v,hC.v,2)}</tr><tr><td>Reynolds</td>${cmp(hH.Re,hC.Re,0)}</tr><tr><td>Prandtl</td>${cmp(hH.Pr,hC.Pr,2)}</tr>
    <tr><td>Nusselt</td>${cmp(hH.Nu,hC.Nu,1)}</tr><tr><td>h (W/m²K)</td>${cmp(hH.h,hC.h,0)}</tr><tr><td>Perda de carga (kPa)</td>${cmp(hH.dP,hC.dP,1,1e-3)}</tr></tbody></table></div>`:''}</div>`)}
  </div>
  ${opts.length?card('Prova da geometria',`<div class="stack"><div class="scroll">${P.chartGeom(opts,ci)}</div><div class="scroll"><table><thead><tr><th>Alternativa</th><th class="r">Nº</th><th class="r">Área m²</th><th class="r">U W/m²K</th><th class="r">ΔP q/f kPa</th><th class="r">CAPEX R$ mi</th><th class="r">Custo anual R$ mi</th><th></th></tr></thead><tbody>${oT}</tbody></table></div>
   <div class="info ${ci===bi?'ok':'warn'}">${ic(ci===bi?'check':'alert',18)}<span>${ci===bi?`A geometria em uso é a de menor custo anual equivalente entre as ${opts.length} alternativas, para a mesma carga (${fE(x.Q,2)} ${eL()}) e o mesmo UA necessário (${fmt(x.Q/x.lm,0)} kW/K).`:`Há alternativa mais barata: ${esc(best?best.label:'')}. Clique em “Usar” para aplicá-la.`}</span></div></div>`,{icon:'check',sub:'Todas dimensionadas para a mesma carga e as mesmas temperaturas, com ΔP até o limite. Custo anual = CAPEX × ARF + bombeamento.'}):''}
  ${r?`<div class="grid g2">${card('Desempenho global',`<dl class="kv"><dt>Coeficiente global U</dt><dd>${fmt(r.U,0)} W/m²K</dd><dt>Área total</dt><dd>${fmt(r.A,1)} m²</dd><dt>UA disponível</dt><dd>${fmt(r.UA,0)} kW/K</dd><dt>UA necessário (Q/LMTD)</dt><dd>${fmt(x.Q/x.lm,0)} kW/K</dd><dt>LMTD</dt><dd>${fmt(x.lm,1)} °C</dd><dt>NTU / efetividade</dt><dd>${fmt(x.NTU,2)} / ${fmt(x.eps,3)}</dd><dt>Carga</dt><dd>${fE(x.Q,2)} ${eL()}</dd><dt>Bombeamento extra</dt><dd>${fmt(x.kw,1)} kW</dd><dt>Custo instalado</dt><dd>${fM(x.cost)}</dd></dl>`,{icon:'result'})}${card('Conta deste trocador',`<div class="eq">${esc(memo)}</div>`,{icon:'file'})}</div>`:''}
  ${wnav('geometria')}`;
}

/* ---------- 5 · Resultados ---------- */
function pageResultados(){

  const mx=Math.max(...items.map(i=>Math.abs(i[1])),1);
  const bars=`<div class="bars">${items.map(([n,v])=>`<div class="bar"><span>${n}</span><div class="tr"><i style="width:${Math.abs(v)/mx*100}%;background:${v>=0?'var(--accent)':'var(--crit)'}"></i></div><span class="v">${v<0?'−':''}${fM(Math.abs(v))}</span></div>`).join('')}</div>`;
  const cap=[...R.exRows.filter(x=>x.cost>0).map(x=>[x.e.id+(x.e.isNew?' (novo)':' (ampliação)'),x.Aadd,x.cost]),...R.heatRows.map(h=>[`Aquecedor ${h.k.replace('|',' · ')}`,h.add,h.c])];
  const evap=R.evRows.map(q=>`<tr><td>${q.n}</td><td class="r m">${fmt(q.V0,1)}</td><td class="r m">${fmt(q.V,1)}</td><td class="r m">${fmt(q.rate0,1)}</td><td class="r m">${fmt(q.rate,1)}</td><td>${q.rate>q.rate0*1.25?chip('verificar área','warn'):chip('ok','ok')}</td></tr>`).join('');
  return `${stepper('resultados')}
  <div class="grid g4">
   ${kpi('bolt','hot','Utilidades quentes',fE(qhB),eL(),`↓ ${fmt((qh-qhB)/qh*100,1)}% · atual ${fE(qh)}`,'up')}
   ${kpi('snow','cold','Utilidades frias',fE(qcB),eL(),`↓ ${fmt((qc-qcB)/qc*100,1)}% · atual ${fE(qc)}`,'up')}
   ${kpi('flame','warn','Escape economizado',fmt(m.dEsc,1),'t/h',`${fmt(m.vmtc0,0)} → ${fmt(m.vmtc,0)} kg vapor/tc`,'up')}
   ${kpi('leaf','acc','CO₂ fóssil evitado',fmt(env.co2Avoid/1000,1),'mil t/ano',`bagaço que deixa de ser queimado`)}
  </div>
  <div class="grid g21">
   ${card('',P.chartBalance(R))}
   <div class="stack">
    ${card('Indicadores econômicos',`<div class="grid g3" style="gap:10px"><div><p class="note">Investimento</p><b style="font:600 19px var(--display)">${fM(m.capHX)}</b></div><div><p class="note">Payback</p><b style="font:600 19px var(--display)">${yrs(m.paybackH)}</b></div><div><p class="note">VPL ${e.n} anos</p><b style="font:600 19px var(--display)">${fM(m.npvH,1)}</b></div></div>
     <dl class="kv" style="margin-top:10px"><dt>Retorno líquido</dt><dd>${fM(m.netH)}/ano</dd><dt>Bagaço poupado</dt><dd>${fmt(m.dBag,1)} t/h</dd><dt>Área nova</dt><dd>${fmt(m.Anew,0)} m²</dd></dl>`,{icon:'money'})}
    ${card('Impacto ambiental',`<dl class="kv"><dt>Bagaço que sobra</dt><dd>${fmt(env.bagAno/1000,1)} mil t/ano</dd><dt>CO₂ fóssil evitado, se substituir ${{gn:'gás natural',oc:'óleo combustível',none:'nada'}[st.env.fuel]}</dt><dd>${fmt(env.co2Avoid,0)} t/ano</dd><dt>Água de reposição poupada</dt><dd>${fmt(env.waterAno,0)} m³/ano</dd><dt>CO₂ biogênico capturado</dt><dd>${R.prop.co2on?fmt(env.co2Cap,0)+' t/ano':'captura desligada'}</dd><dt>Exergia destruída: A → B</dt><dd>${fE(m.exA,2)} → ${fE(m.exB,2)} ${eL()}</dd></dl>`,{icon:'leaf',sub:'Fatores na aba Configurações › Ambiental.'})}
   </div>
  </div>
  <div class="grid g2">
   ${card('Integração térmica',`<div class="stack">${bars}<dl class="kv"><dt>Escape: Cenário A → B</dt><dd>${fmt(m.EscapeBase,1)} → ${fmt(m.Escape,1)} t/h</dd><dt>VM evitado na redutora</dt><dd>${fmt(m.dVM,1)} t/h</dd><dt>Potencial se atingir o alvo</dt><dd>${fmt(m.dEscTarget,1)} t/h de escape</dd><dt>Torre: carga evitada</dt><dd>${fmt(f.dQtower,1)} MW</dd><dt>Condensador do 5º efeito</dt><dd>${sgn(f.dQcond,1)} MW</dd></dl></div>`,{icon:'flame',sub:'Retorno anual da economia de vapor e de torre.'})}
   ${card('Valoração do CO₂',`<dl class="kv"><dt>Produção</dt><dd>${R.prop.co2on?fmt(ch.tph,2)+' t/h · '+fmt(ch.tph*e.hours,0)+' t/safra':'desligada'}</dd><dt>Receita</dt><dd>${fM(m.revCO2)}/ano</dd><dt>Energia, torre e manutenção</dt><dd>${fM(f.opCO2)}/ano</dd><dt>Resultado operacional</dt><dd>${fM(m.netCO2)}/ano</dd><dt>CAPEX instalado</dt><dd>${fM(m.capCO2)}</dd><dt>Projeto completo: retorno</dt><dd>${fM(m.net)}/ano</dd><dt>Projeto completo: payback</dt><dd>${yrs(m.payback)}</dd></dl><p class="note" style="margin-top:8px">Preço de R$ ${fmt(e.pCO2,0)}/t (AgFeed, 2023) e CAPEX escalado de uma planta de 2 t/h: ordem de grandeza até ter cotação.</p>`,{icon:'cloud'})}
  </div>
  ${P.refsCard(true)}
  <div class="grid g2">
   ${card('CAPEX por item',`<div class="scroll"><table><thead><tr><th>Item</th><th class="r">Área m²</th><th class="r">Custo</th></tr></thead><tbody>${cap.map(c=>`<tr><td>${esc(c[0])}</td><td class="r m">${fmt(c[1],0)}</td><td class="r m">${fM(c[2])}</td></tr>`).join('')||'<tr><td colspan="3" class="note">Sem investimento em trocadores.</td></tr>'}</tbody><tfoot><tr><td>Total</td><td class="r m">${fmt(m.Anew,0)}</td><td class="r m">${fM(m.capHX)}</td></tr></tfoot></table></div>`,{icon:'money'})}
   ${card('Efeito na evaporação',`<div class="scroll"><table><thead><tr><th>Efeito</th><th class="r">A t/h</th><th class="r">B t/h</th><th class="r">Taxa A</th><th class="r">Taxa B</th><th></th></tr></thead><tbody>${evap}</tbody></table></div>`,{icon:'drop',sub:'Mudar as sangrias muda a vazão de cada efeito. Taxa em kg/m²/h.'})}
  </div>
  ${wnav('resultados')}`;
}
Object.assign(P,{configRows,pageRede,pageGeometria,pageResultados,statusOf});
})();
</script>
<script>
'use strict';
/* PinchSim · Cenários, Sensibilidade, CO₂, Relatório, Configurações e laço principal */
(function(){
const P=window.PS;
const {LE,LD,$,esc,fmt,sgn,yrs,fE,eL,fM,ic,inp,sel,chk,fld,chip,METRICS,PARAMS,OBJ,metricOf,evalQuiet,clone,card,kpi,presetName,KEY}=P;
const S=()=>P.state;

/* ---------- Cenários ---------- */
function runVary(){
  const st=S(),Q=PARAMS[st.ui.vary.param];
  const vals=String(st.ui.vary.vals||'').split(/[;\s]+/).map(t=>t.replace(/,+$/,'')).filter(t=>t!=='').map(t=>+t.replace(',','.')).filter(Number.isFinite).slice(0,12);
  P.varyRes={param:st.ui.vary.param,rows:vals.map(x=>{const c=clone(st);Q.v(c,x);const r=evalQuiet(c);return {x,m:r.metrics};})};
}
function pageCenarios(){
  const st=S(),Q=PARAMS[st.ui.vary.param];
  if(!P.varyRes||P.varyRes.param!==st.ui.vary.param)runVary();
  const V=P.varyRes,cur=Q.g(st);
  const rows=P.configRows();
  const tb=V.rows.map(r=>`<tr class="${Math.abs(r.x-cur)<1e-9?'hl':''}"><td class="m">${fmt(r.x,r.x%1?2:0)}</td><td class="r m">${fE(r.m.QHminA*1000,2)}</td><td class="r m">${fE(r.m.QHnet*1000,2)}</td><td class="r m">${fE(r.m.QCnet*1000,2)}</td><td class="r m">${fmt(r.m.dEsc,1)}</td><td class="r m">${fmt(r.m.capHX/1e6,2)}</td><td class="r m">${Number.isFinite(r.m.paybackH)?fmt(r.m.paybackH,2):'—'}</td><td class="r m">${fmt(r.m.npvH/1e6,1)}</td><td class="r m">${fmt(r.m.co2Avoid,0)}</td></tr>`).join('');
  return `${card('Comparativo de cenários',`<div class="row" style="margin-bottom:12px">${fld('Variar',sel('ui.vary.param',st.ui.vary.param,Object.entries(PARAMS).map(([k,v])=>[k,`${v.l}${v.u?' ('+v.u+')':''}`]),{label:'Parâmetro'}))}
    <label class="f"><span>Valores</span><input id="f-vary-vals" class="t" type="text" value="${esc(st.ui.vary.vals)}" data-bind="ui.vary.vals" aria-label="Valores" style="width:220px"></label>
    <button class="btn p" data-act="vary" style="align-self:end">Atualizar</button></div>
   <div class="grid g2"><div class="scroll"><table><thead><tr><th>${esc(Q.l)}${Q.u?' ('+Q.u+')':''}</th><th class="r">QH mín ${eL()}</th><th class="r">Vapor ${eL()}</th><th class="r">Torre ${eL()}</th><th class="r">Escape t/h</th><th class="r">CAPEX R$ mi</th><th class="r">Payback</th><th class="r">VPL R$ mi</th><th class="r">CO₂ t/ano</th></tr></thead><tbody>${tb}</tbody></table></div>
   <div>${V.rows.length>1?P.chartVary(V.rows,Q,cur):'<p class="note">Informe ao menos dois valores separados por vírgula e espaço.</p>'}</div></div>`,{icon:'layers',sub:`Mantém o Cenário B (${esc(presetName(st.preset))}) e muda um parâmetro. Separe os valores com vírgula e espaço; a linha verde é o valor atual.`})}
  ${card('Configurações lado a lado',`<div class="scroll"><table><thead><tr><th>Configuração</th><th class="r">Vapor ${eL()}</th><th class="r">Torre ${eL()}</th><th class="r">Escape t/h</th><th class="r">Área m²</th><th class="r">CAPEX R$ mi</th><th class="r">Retorno R$ mi/ano</th><th class="r">Payback</th><th class="r">VPL R$ mi</th><th class="r">Exergia ${eL()}</th><th></th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="${r.k===st.preset?'hl':''}"><td><b>${esc(r.name)}</b> ${r.best?chip('melhor','ok'):''}</td><td class="r m">${fE(r.m.QHnet*1000,1)}</td><td class="r m">${fE(r.m.QCnet*1000,1)}</td><td class="r m">${fmt(r.m.dEsc,1)}</td><td class="r m">${fmt(r.m.Anew,0)}</td><td class="r m">${fmt(r.m.capHX/1e6,2)}</td><td class="r m">${fmt(r.m.netH/1e6,2)}</td><td class="r m">${Number.isFinite(r.m.paybackH)?fmt(r.m.paybackH,2):'—'}</td><td class="r m">${fmt(r.m.npvH/1e6,1)}</td><td class="r m">${fE(r.m.exB,2)}</td><td>${r.k===st.preset||r.k==='custom'?'':`<button class="btn s" data-act="preset" data-k="${r.k}">Usar como B</button>`}</td></tr>`).join('')}</tbody></table></div>`,{icon:'scale',sub:`Mesmos parâmetros para todas. “Melhor” segue o objetivo: ${OBJ[st.obj][0].toLowerCase()}.`})}`;
}

/* ---------- Sensibilidade ---------- */
function curveSVG(){
  const st=S(),k=st.ui.sens,pk=st.ui.curve||'C4T',Q=PARAMS[pk],Mt=METRICS[k],x0=Q.g(st);
  const n=14,xs=[...Array(n+1)].map((_,i)=>Q.lo+(Q.hi-Q.lo)*i/n),ys=xs.map(x=>{const c=clone(st);Q.v(c,x);return metricOf(evalQuiet(c),k);});
  const ref=st.refs.find(r=>r.k===k);
  window.__curve={pk,k,xs,ys};
  const all=[...ys.filter(Number.isFinite),...(ref?[+ref.v]:[])],ymin=Math.min(...all),ymax=Math.max(...all),pad=(ymax-ymin)*.1||1;
  const svg=P.plot({h:300,x:[Q.lo,Q.hi],y:[ymin-pad,ymax+pad],xl:`${Q.l}${Q.u?' ('+Q.u+')':''}`,yl:`${Mt.u}`,xf:v=>fmt(v,Q.hi<5?2:0),yf:v=>fmt(v,Math.abs(ymax)<10?1:0),body:(sx,sy,g)=>{
    let s=P.line(xs.map((x,i)=>[sx(x),sy(ys[i])]).filter(p=>Number.isFinite(p[1])),'var(--accent)',{w:2.5});
    xs.forEach((x,i)=>{if(Number.isFinite(ys[i]))s+=`<circle cx="${sx(x)}" cy="${sy(ys[i])}" r="10" fill="transparent" data-tip="${esc(Q.l)} = ${fmt(x,2)}\n${esc(Mt.l)}: ${fmt(ys[i],Mt.d)} ${Mt.u}"/>`;});
    s+=`<line x1="${sx(x0)}" x2="${sx(x0)}" y1="${g.t}" y2="${g.h-g.b}" stroke="var(--ink2)" stroke-dasharray="5 4"/><text class="t" x="${sx(x0)+6}" y="${g.t+12}">atual ${fmt(x0,2)}</text>`;

${esc(S1)}</div></section>

R(k) = R(k−1) − ΔH(k), com R(0) = 0

Escape = k·V1 + VE = ${fmt(st.evap.k,4)}·${fmt(ev.V1,2)} + ${fmt(Pp.xHeat.VE,2)} = ${fmt(Pp.Escape,2)} t/h   (k = 333,23/314,31)

ΔVM = ΔEscape·(${fmt(b.prvIn,1)}/${fmt(b.prvOut,2)}) = ${fmt(m.dVM,2)} t/h   ΔBagaço = ΔVM/${fmt(b.kgVkgB,3)} = ${fmt(m.dBag,2)} t/h

T2 = T1 + T1·[r^((k−1)/k) − 1]/ηs

  <section><h3>Hipóteses a validar com o grupo</h3><ul>
   <li><b>Vinho.</b> Sai das dornas a ${fmt(vin.Tin,0)} °C e entra na coluna a ${fmt(vin.Tout,0)} °C; vinhaça a ${fmt(st.dest.Tvinhaca,0)} °C no fundo da coluna A. O PMS corta essas temperaturas (p.8).</li>
   <li><b>Sem condensador E.</b> O vinho é aquecido só pelo K e pelo vapor da coluna, porque o PMS mostra os condensadores resfriados a água.</li>
   <li><b>Caldo açúcar como corrente única.</b> 928,71 t/h e 15,65 °Bx de 31,57 a 105 °C; erro de CP antes da dosagem de 0,8%.</li>

   <li>Kemp, <i>Pinch Analysis and Process Integration</i>: tabela problema; o caso de 4 correntes testa o programa (QH 20, QC 60).</li>

function applyPreset(k){

}
document.addEventListener('change',ev=>{
  const t=ev.target;

  if(!t.dataset||!t.dataset.bind)return;
  let v=t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?null:+t.value):t.value;
  if(t.dataset.num)v=+v;
  if(t.dataset.scale&&v!=null)v=v/+t.dataset.scale;
  const p=t.dataset.bind,st=S();
  P.setPath(st,p,v);
  if(p.startsWith('net.')){st.preset='custom';P.ordersRes=null;}
  if(/^net\.exchangers\.\d+\.type$/.test(p)){const e=st.net.exchangers[+p.split('.')[2]];if(e.geom)e.geom=v==='PHE'?LD.G_PHE({NpH:1,NpC:1,beta:45}):LD.G_ST();}
  if(p.startsWith('ui.goal'))P.goal=null;
  if(p==='cfg.look'){applyLook();setTimeout(scenes,0);}
  if(!p.startsWith('ui.vary'))P.varyRes=null;
  P.toast='';setTimeout(draw,0);
});

document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-page],[data-act]');if(!t)return;
  if(t.dataset.page){go(t.dataset.page);return;}
  const a=t.dataset.act,st=S();
  if(a==='preset')applyPreset(t.dataset.k);
  else if(a==='look'){st.cfg.look=t.dataset.k;applyLook();draw();scenes();}
  else if(a==='view'){st.ui.netView=t.dataset.k;draw();}
  else if(a==='train'){st.ui.train=t.dataset.k;draw();}
  else if(a==='obj'){st.obj=t.dataset.k;draw();}
  else if(a==='method'){st.method=t.dataset.k;draw();}
  else if(a==='cfgtab'){st.ui.cfgTab=t.dataset.k;draw();}
  else if(a==='sel'){st.ui.sel=t.dataset.k;draw();}
  else if(a==='ex-del'){st.net.exchangers.splice(+t.dataset.i,1);st.preset='custom';draw();}
  else if(a==='ex-add'){let n=1;while(st.net.exchangers.some(e=>e.id==='E-'+n))n++;st.net.exchangers.push({id:'E-'+n,name:'Novo trocador',hot:'H1',cold:'C3',posH:9,posC:1,spec:'dT',isNew:true,eta:.96,type:'PHE',Uref:1200,geom:LD.G_PHE({NpH:1,NpC:1,beta:45})});st.preset='custom';st.ui.sel='E-'+n;draw();}
  else if(a==='orders'){P.ordersRes=LE.orders(st);draw();}
  else if(a==='geom-add'){const e=st.net.exchangers.find(q=>q.id===st.ui.sel)||st.net.exchangers[0];e.type=t.dataset.t;e.geom=t.dataset.t==='PHE'?LD.G_PHE({NpH:1,NpC:1,beta:45}):LD.G_ST();e.spec='dT';st.preset='custom';draw();}
  else if(a==='geom-fix'){const x=P.R.exRows.find(r=>r.e.id===st.ui.sel),e=st.net.exchangers.find(q=>q.id===st.ui.sel);if(x&&x.auto&&e){e.geom={...e.geom,...x.auto.geom};e.spec='geom';st.preset='custom';draw();}}
  else if(a==='geom-use'){
    const x=P.R.exRows.find(r=>r.e.id===st.ui.sel)||P.R.exRows.find(r=>r.r&&r.e.isNew),e=x&&st.net.exchangers.find(q=>q.id===x.e.id);
    const o=x&&LE.geomOptions(P.R,x.e.id)[+t.dataset.i];
    if(o&&e){e.type=o.type;e.geom={...o.geom};st.preset='custom';draw();}
  }
  else if(a==='vary'){runVary();draw();}
  else if(a==='ref-del'){st.refs.splice(+t.dataset.i,1);draw();}
  else if(a==='ref-add'){const k=st.ui.newRef||Object.keys(METRICS).find(q=>!st.refs.some(r=>r.k===q));if(k&&!st.refs.some(r=>r.k===k)){st.refs.push({k,v:+metricOf(P.R,k).toFixed(METRICS[k].d)});st.ui.newRef=null;}draw();}
  else if(a==='goal-pick'){st.ui.goal.metric=t.dataset.k;const rf=st.refs.find(r=>r.k===t.dataset.k);st.ui.goal.target=rf?rf.v:null;st.ui.goal.param={QHbase:'C4T',metaBal:'C4T',recMV:'H3T',QCbase:'H1Tf',QCminA:'dTmin',QHminA:'dTmin',pot:'dTmin'}[t.dataset.k]||st.ui.goal.param;P.goal=null;draw();const el=document.getElementById(P.fid('ui.goal.target'));if(el)el.scrollIntoView({block:'center'});}
  else if(a==='goal'){
    const g=st.ui.goal,Q=PARAMS[g.param],k=g.metric,v=g.target;
    if(v==null||v===''){const i=document.getElementById(P.fid('ui.goal.target'));if(i)i.focus();return;}
    const F=x=>{const c=clone(st);Q.v(c,x);return metricOf(evalQuiet(c),k);};
    const n=36,xs=[],ys=[];for(let i=0;i<=n;i++){const x=Q.lo+(Q.hi-Q.lo)*i/n;xs.push(x);ys.push(F(x));}
    let found=false,a0,b0,best=Infinity;const v0=Q.g(st);
    for(let i=0;i<n;i++){const fa=ys[i]-v,fb=ys[i+1]-v;if(Number.isFinite(fa)&&Number.isFinite(fb)&&fa*fb<=0){const d=Math.abs((xs[i]+xs[i+1])/2-v0);if(d<best){best=d;a0=xs[i];b0=xs[i+1];found=true;}}}
    if(found){let fa=F(a0)-v;for(let i=0;i<40;i++){const m=(a0+b0)/2,fm=F(m)-v;if(fa*fm<=0)b0=m;else{a0=m;fa=fm;}}const x=(a0+b0)/2;P.goal={found:true,x,y:F(x),param:g.param,metric:k,target:v};}
    else{const fin=ys.filter(Number.isFinite);P.goal={found:false,min:Math.min(...fin),max:Math.max(...fin),param:g.param,metric:k,target:v};}
    draw();
  }
  else if(a==='goal-apply'){if(P.goal&&P.goal.found){PARAMS[P.goal.param].v(st,P.goal.x);P.goal=null;P.varyRes=null;draw();}}
  else if(a==='export-csv')save('pinchsim-lins-resumo.csv',csv());
  else if(a==='export-json')save('pinchsim-lins-projeto.json',JSON.stringify(st,null,1));
  else if(a==='export-html')save('pinchsim-lins-relatorio.html',reportHTML());
  else if(a==='copy-json'){const txt=JSON.stringify(st);try{await navigator.clipboard.writeText(txt);P.toast='Cenário copiado.';draw();}catch(e){const io=$('#io');if(io){io.value=txt;io.select();}P.toast='Selecione o texto na caixa e copie.';}}
  else if(a==='import'){const io=$('#io');try{const o=JSON.parse(io.value);if(!o.streams||!o.net||!o.cfg)throw 0;P.state=o;applyLook();P.toast='Cenário importado.';draw();scenes();}catch(e){P.toast='O texto colado não é um cenário válido. Confira se copiou o JSON inteiro.';draw();}}
  else if(a==='reset'){const pg=st.ui.page;P.state=P.defaults();P.state.ui.page=pg;P.goal=null;P.ordersRes=null;P.varyRes=null;P.toast='Padrões restaurados.';applyLook();draw();scenes();}
});
const tip=$('#tip');
function showTip(ev){
  const t=S().cfg.tips&&ev.target.closest&&ev.target.closest('[data-tip]');
  if(!t){tip.hidden=true;return;}
  tip.textContent=t.getAttribute('data-tip');tip.hidden=false;
  const pad=12,w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+pad,y=ev.clientY+pad;
  if(x+w>innerWidth-6)x=ev.clientX-w-pad;if(y+h>innerHeight-6)y=ev.clientY-h-pad;
  tip.style.left=Math.max(4,x)+'px';tip.style.top=Math.max(4,y)+'px';
}
document.addEventListener('pointermove',showTip);document.addEventListener('pointerdown',showTip);
document.addEventListener('scroll',()=>{tip.hidden=true;},{passive:true});
let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(scenes,150);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTimeout(scenes,50));}catch(e){}
try{new MutationObserver(()=>setTimeout(scenes,50)).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
buildShell();
const h=(location.hash||'').slice(1);if(PAGES[h])S().ui.page=h;
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(PAGES[k]&&S().ui.page!==k){S().ui.page=k;draw();}});
applyLook();draw();scenes();
window.__sim={get state(){return S();},get R(){return P.R;},draw,applyPreset,go};
})();
